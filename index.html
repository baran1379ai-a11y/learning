<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>Learning OS — سیستم‌عامل یادگیری</title>
  
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <link rel="manifest" href="./manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    /* انیمیشن پلک زدن خرگوش */
    @keyframes blinkEyes {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    .bunny-blink {
      transform-origin: center;
      animation: blinkEyes 4s infinite;
    }

    /* تکان خوردن ملایم گوش‌ها */
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3deg); }
    }
    .bunny-ear-left {
      transform-origin: bottom center;
      animation: earWiggle 3.5s ease-in-out infinite;
    }
    .bunny-ear-right {
      transform-origin: bottom center;
      animation: earWiggle 3.5s ease-in-out infinite reverse;
    }

    /* دست خرگوش در حال نوشتن */
    @keyframes rabbitWriting {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-2px, 3px); }
    }
    .bunny-hand-write {
      animation: rabbitWriting 0.6s infinite ease-in-out;
    }

    /* ورق خوردن نرم کاغذ کتاب */
    @keyframes bookPageTurn {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(-180deg); }
      100% { transform: rotateY(-180deg); }
    }
    .vector-page {
      transform-origin: left center;
      animation: bookPageTurn 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* باران شیشه‌ای */
    .rain-glass {
      background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15), transparent 70%),
                  linear-gradient(to bottom, #1e1b4b, #0f172a);
    }
  </style>
</head>
<body class="text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 min-h-screen relative overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const db = new Dexie('LearningOS_Cognitive_DB');
    db.version(3).stores({
      paths: 'id, title, nature, priority',
      resources: 'id, pathId, title, type, content, url',
      topics: 'id, pathId, resourceId, title, isWeak, mastery, prereqTopicId',
      tasks: 'id, pathId, status, priority, isVital, scheduledDate',
      sessions: 'id, pathId, durationMinutes, timestamp',
      quizzes: 'id, topicId, score, timestamp',
      flashcards: 'id, topicId, front, back, step, nextReviewDate',
      goals: 'id, pathId, title, type, targetMonth, progress',
      calendarEvents: 'id, title, date, impactLevel',
      profile: 'id, fullName, avatar, age, field, interests'
    });

    const SUPABASE_URL = 'https://lwsndcosdmjxkhnhjhwx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6cS5z3_zbFNr0HN0u3ZD9A_c5uVewyV';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function getJalaliDate() {
      try {
        return new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(new Date());
      } catch (e) {
        return "امروز، روز یادگیری و پیشرفت";
      }
    }

    // شاخه پیچک و برگ‌های زنده در حاشیه صفحه که با مطالعه جوانه می‌زنند
    function LivingVineFrame({ studyMinutes = 0 }) {
      const growthLevel = Math.min(100, Math.max(20, studyMinutes * 2));
      return (
        <div className="fixed inset-0 pointer-events-none z-10 overflow-hidden">
          {/* شاخه پیچک بالا راست */}
          <svg className="absolute top-0 right-0 w-64 sm:w-80 h-64 sm:h-80 opacity-80" viewBox="0 0 300 300" fill="none">
            <path 
              d="M300,0 C220,40 170,110 150,190 C135,240 90,270 10,290" 
              stroke="#15803d" 
              strokeWidth="5" 
              strokeLinecap="round" 
              strokeDasharray="400"
              strokeDashoffset={400 - (400 * growthLevel) / 100}
              className="transition-all duration-1000"
            />
            {/* برگ‌های شاخه که گام‌به‌گام باز می‌شوند */}
            <g className="transition-all duration-700" opacity={growthLevel > 30 ? 1 : 0}>
              <path d="M210,80 C200,60 220,45 240,55 C240,75 225,90 210,80 Z" fill="#4ade80" />
              <path d="M165,150 C150,140 155,120 175,125 C185,140 180,155 165,150 Z" fill="#22c55e" />
            </g>
            <g className="transition-all duration-700" opacity={growthLevel > 60 ? 1 : 0}>
              <path d="M140,215 C125,205 135,185 155,193 C160,210 150,223 140,215 Z" fill="#86efac" />
              <circle cx="166" cy="148" r="4" fill="#fb7185" />
            </g>
            <g className="transition-all duration-700" opacity={growthLevel > 80 ? 1 : 0}>
              <path d="M70,270 C55,265 60,245 80,250 C90,265 85,277 70,270 Z" fill="#16a34a" />
              <circle cx="140" cy="214" r="5" fill="#f43f5e" />
            </g>
          </svg>

          {/* شاخه لطیف پایین چپ */}
          <svg className="absolute bottom-0 left-0 w-48 sm:w-64 h-48 sm:h-64 opacity-60 rotate-180" viewBox="0 0 300 300" fill="none">
            <path d="M300,0 C230,50 190,130 160,220" stroke="#16a34a" strokeWidth="4" strokeLinecap="round"/>
            <path d="M220,80 C210,60 230,45 250,55 C250,75 235,90 220,80 Z" fill="#86efac" />
            <path d="M175,170 C160,160 165,140 185,145 C195,160 190,175 175,170 Z" fill="#4ade80" />
          </svg>
        </div>
      );
    }

    // کاراکتر وکتور خرگوش مطالعه (سبک اصیل Study Bunny)
    function StudyBunnyCharacter({ isStudying }) {
      return (
        <div className="relative flex flex-col items-center justify-center select-none">
          <svg width="180" height="190" viewBox="0 0 200 210" fill="none" className="drop-shadow-2xl">
            {/* گوش چپ */}
            <g className="bunny-ear-left">
              <ellipse cx="65" cy="50" rx="14" ry="45" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="3" />
              <ellipse cx="65" cy="52" rx="7" ry="32" fill="#fbcfe8" />
            </g>

            {/* گوش راست */}
            <g className="bunny-ear-right">
              <ellipse cx="135" cy="50" rx="14" ry="45" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="3" />
              <ellipse cx="135" cy="52" rx="7" ry="32" fill="#fbcfe8" />
            </g>

            {/* بدن خرگوش */}
            <ellipse cx="100" cy="155" rx="55" ry="45" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="3" />
            {/* بافت هودی/لباس خرگوش */}
            <path d="M60,150 Q100,165 140,150 Q135,190 100,195 Q65,190 60,150 Z" fill="#818cf8" opacity="0.9" />

            {/* سر خرگوش */}
            <circle cx="100" cy="105" r="46" fill="#ffffff" stroke="#cbd5e1" strokeWidth="3" />

            {/* گونه‌های گل‌انداخته صورتی */}
            <ellipse cx="73" cy="118" rx="7" ry="4" fill="#f472b6" opacity="0.5" />
            <ellipse cx="127" cy="118" rx="7" ry="4" fill="#f472b6" opacity="0.5" />

            {/* چشم‌ها با قابلیت پلک‌زدن */}
            <g className="bunny-blink">
              {isStudying ? (
                // چشم‌های متمرکز و خوشحال حین مطالعه
                <g stroke="#1e293b" strokeWidth="3" strokeLinecap="round" fill="none">
                  <path d="M74,106 Q82,99 90,106" />
                  <path d="M110,106 Q118,99 126,106" />
                </g>
              ) : (
                // چشم‌های درشت و کنجکاو خرگوش
                <g fill="#0f172a">
                  <circle cx="82" cy="105" r="5" />
                  <circle cx="80" cy="103" r="1.5" fill="#ffffff" />
                  <circle cx="118" cy="105" r="5" />
                  <circle cx="116" cy="103" r="1.5" fill="#ffffff" />
                </g>
              )}
            </g>

            {/* عینک مطالعه که حین درس خواندن روی صورت قرار می‌گیرد */}
            {isStudying && (
              <g stroke="#d97706" strokeWidth="2.5" fill="none">
                <circle cx="82" cy="105" r="12" fill="rgba(255,255,255,0.3)" />
                <circle cx="118" cy="105" r="12" fill="rgba(255,255,255,0.3)" />
                <path d="M94,105 L106,105" />
              </g>
            )}

            {/* بینی و دهان ظریف خرگوش */}
            <polygon points="100,114 97,118 103,118" fill="#fb7185" />
            <path d="M97,119 Q100,123 103,119" stroke="#94a3b8" strokeWidth="2" fill="none" />

            {/* دست خرگوش در حال نوشتن با مداد */}
            {isStudying ? (
              <g className="bunny-hand-write">
                <ellipse cx="125" cy="160" rx="9" ry="7" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
                <rect x="122" y="142" width="4" height="20" rx="2" transform="rotate(30 122 142)" fill="#f59e0b" />
              </g>
            ) : (
              <g>
                <ellipse cx="75" cy="160" rx="8" ry="6" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
                <ellipse cx="125" cy="160" rx="8" ry="6" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
              </g>
            )}
          </svg>

          {/* میز چوبی و دفترچه ورق‌خور */}
          <div className="w-64 sm:w-72 h-8 bg-gradient-to-r from-amber-700 via-amber-800 to-amber-950 rounded-2xl -mt-5 shadow-2xl flex items-center justify-center relative border-t-2 border-amber-500/40">
            {/* دفترچه و کاغذهای باز روی میز */}
            <div className="absolute -top-4 flex items-center">
              <div className="w-11 h-7 bg-amber-50 rounded-l border-r border-slate-300 shadow flex flex-col justify-center px-1 space-y-1">
                <div className="w-7 h-0.5 bg-slate-300"></div>
                <div className="w-5 h-0.5 bg-slate-300"></div>
              </div>

              {/* برگه متحرک که حین مطالعه ورق می‌خورد */}
              <div className={`w-11 h-7 bg-white rounded-r shadow flex flex-col justify-center px-1 space-y-1 ${
                isStudying ? 'vector-page' : ''
              }`}>
                <div className="w-6 h-0.5 bg-indigo-200"></div>
                <div className="w-4 h-0.5 bg-indigo-200"></div>
              </div>
            </div>

            {/* فنجان چای با بخار گرم */}
            <div className="absolute right-4 -top-3.5 text-base relative">
              <span>🍵</span>
              {isStudying && (
                <span className="absolute -top-3 left-1 text-[10px] opacity-70 animate-bounce">♨</span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // اتاق تمرکز کامل با محیط دنج، صداهای طبیعی بدون فیلتر و تایمر
    function FocusRoomView({ onSessionSaved }) {
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [selectedMinutes, setSelectedMinutes] = useState(25);
      const [isRunning, setIsRunning] = useState(false);
      const [sessionSecondsPassed, setSessionSecondsPassed] = useState(0);
      const [totalTodayMinutes, setTotalTodayMinutes] = useState(20);
      const [activeSound, setActiveSound] = useState('rain');
      const [volume, setVolume] = useState(0.5);

      const audioRef = useRef(null);

      // فایل‌های صوتی عمومی و سبک طبیعی
      const SOUND_TRACKS = {
        rain: { title: 'باران دنج پشت پنجره', icon: '🌧️', url: 'https://actions.google.com/sounds/v1/weather/rain_heavy.ogg' },
        stream: { title: 'رودخانه و آب جاری', icon: '🌊', url: 'https://actions.google.com/sounds/v1/water/stream_water.ogg' },
        wind: { title: 'نویز سفید برگ‌ها', icon: '🍃', url: 'https://actions.google.com/sounds/v1/weather/light_wind_trees.ogg' },
        cafe: { title: 'کافه خلوت', icon: '☕', url: 'https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg' }
      };

      // مدیریت اجرای صداها
      useEffect(() => {
        if (audioRef.current) {
          if (isRunning && activeSound) {
            audioRef.current.src = SOUND_TRACKS[activeSound].url;
            audioRef.current.volume = volume;
            audioRef.current.play().catch(() => {});
          } else {
            audioRef.current.pause();
          }
        }
      }, [isRunning, activeSound]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = volume;
        }
      }, [volume]);

      // تایمر دقیق
      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft(prev => prev - 1);
            setSessionSecondsPassed(s => s + 1);
          }, 1000);
        } else if (timeLeft === 0 && isRunning) {
          handleCompleteSession();
        }
        return () => clearInterval(interval);
      }, [isRunning, timeLeft]);

      const handleSetDuration = (m) => {
        if (isRunning) return;
        setSelectedMinutes(m);
        setTimeLeft(m * 60);
        setSessionSecondsPassed(0);
      };

      const handleReset = () => {
        setIsRunning(false);
        setTimeLeft(selectedMinutes * 60);
        setSessionSecondsPassed(0);
      };

      const handleCompleteSession = async () => {
        setIsRunning(false);
        const mins = Math.max(1, Math.round(sessionSecondsPassed / 60));
        setTotalTodayMinutes(prev => prev + mins);

        await db.sessions.add({
          id: 'sess-' + Date.now(),
          durationMinutes: mins,
          timestamp: new Date().toISOString()
        });

        if (supabaseClient) {
          try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
              await supabaseClient.from('study_sessions').insert([{
                user_id: user.id,
                duration_minutes: mins
              }]);
            }
          } catch (e) {}
        }

        alert(`آفرین! ${mins} دقیقه تمرکز عمیق با موفقیت ثبت شد و شاخه‌های اتاقت رشد کردند 🌱`);
        if (onSessionSaved) onSessionSaved();
        handleReset();
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="space-y-6 max-w-2xl mx-auto">
          {/* محفظه اتمسفریک اتاق مطالعه بانی */}
          <div className="rain-glass rounded-3xl p-6 sm:p-8 text-white shadow-2xl relative overflow-hidden border border-indigo-500/30">
            
            {/* نور گرم چراغ مطالعه که با شروع تمرکز روشن می‌شود */}
            <div className={`absolute top-0 right-1/4 w-80 h-80 rounded-full blur-3xl pointer-events-none transition-all duration-1000 ${
              isRunning ? 'bg-amber-300/20 scale-125' : 'bg-indigo-500/10 scale-90'
            }`}></div>

            <div className="relative z-10 flex items-center justify-between">
              <span className="text-xs bg-white/10 px-3 py-1.5 rounded-full border border-white/15 font-bold flex items-center gap-1.5">
                <span>🌱</span> رشد شاخه‌ها: <b>{totalTodayMinutes} دقیقه</b>
              </span>
              <span className="text-xs text-indigo-200">اتاق تمرکز و مطالعه زنده</span>
            </div>

            {/* کاراکتر وکتور تعاملی و میز مطالعه */}
            <div className="py-6 flex flex-col items-center justify-center relative z-10">
              <StudyBunnyCharacter isStudying={isRunning} />
              <div className="mt-4 text-xs font-bold text-indigo-200 backdrop-blur-md bg-black/30 px-4 py-1.5 rounded-full border border-white/10">
                {isRunning ? '🤫 بانی همراه تو غرق نوشتن و مطالعه است...' : '☕ منتظر توست؛ شروع را بزن تا درس خواندن را شروع کند!'}
              </div>
            </div>

            {/* انتخاب مدت جلسه */}
            {!isRunning && (
              <div className="flex items-center justify-center gap-2 mb-3 relative z-10">
                {[15, 25, 45, 60].map(m => (
                  <button
                    key={m}
                    onClick={() => handleSetDuration(m)}
                    className={`text-xs px-3.5 py-1.5 rounded-xl font-bold transition ${
                      selectedMinutes === m ? 'bg-indigo-500 text-white shadow-md' : 'bg-white/10 text-slate-300 hover:bg-white/20'
                    }`}
                  >
                    {m} دقیقه
                  </button>
                ))}
              </div>
            )}

            {/* ساعت دیجیتال */}
            <div className="text-center my-3 relative z-10">
              <div className="text-5xl sm:text-6xl font-black font-mono tracking-widest text-white drop-shadow-md">
                {formatTime(timeLeft)}
              </div>
            </div>

            {/* دکمه‌های کنترل */}
            <div className="flex items-center justify-center gap-3 relative z-10">
              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`px-8 py-3 rounded-2xl text-xs font-bold text-white shadow-xl transition-all ${
                  isRunning ? 'bg-amber-500 hover:bg-amber-600 shadow-amber-500/30' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-600/40'
                }`}
              >
                {isRunning ? 'مکث مطالعه ⏸' : 'شروع تمرکز با بانی ▶'}
              </button>

              {sessionSecondsPassed > 10 && (
                <button
                  onClick={handleCompleteSession}
                  className="px-4 py-3 bg-emerald-500/30 text-emerald-200 border border-emerald-400/40 rounded-2xl text-xs font-bold hover:bg-emerald-500/40 transition"
                >
                  ثبت جلسه 💾
                </button>
              )}

              <button
                onClick={handleReset}
                className="p-3 bg-white/10 hover:bg-white/20 text-white/80 rounded-2xl border border-white/10 text-xs"
                title="تنظیم مجدد"
              >
                🔄
              </button>
            </div>
          </div>

          {/* صداهای پس‌زمینه زنده */}
          <div className="bg-white/85 backdrop-blur-md p-5 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
            <div className="flex items-center justify-between text-xs">
              <span className="font-bold text-slate-700 flex items-center gap-1.5">
                <span>🎧</span> پخش همزمان صدای آرامش‌بخش:
              </span>
              <span className="text-slate-400 font-medium">ولوم: {Math.round(volume * 100)}%</span>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {Object.entries(SOUND_TRACKS).map(([key, item]) => (
                <button
                  key={key}
                  onClick={() => setActiveSound(key === activeSound ? null : key)}
                  className={`p-3 rounded-2xl border text-center transition-all ${
                    activeSound === key 
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                      : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  <div className="text-xl mb-1">{item.icon}</div>
                  <div className="text-[11px] font-bold">{item.title}</div>
                </button>
              ))}
            </div>

            <input 
              type="range" 
              min="0" 
              max="1" 
              step="0.05"
              value={volume} 
              onChange={e => setVolume(parseFloat(e.target.value))}
              className="w-full accent-indigo-600 cursor-pointer pt-1"
            />
          </div>

          <audio ref={audioRef} loop />
        </div>
      );
    }

    // بدنه اصلی برنامه
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [checkingAuth, setCheckingAuth] = useState(true);
      const [authMode, setAuthMode] = useState('login');

      const [fullName, setFullName] = useState('');
      const [age, setAge] = useState('');
      const [field, setField] = useState('');
      const [interests, setInterests] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      const [currentTab, setCurrentTab] = useState('dashboard');
      const [availableTimeMinutes, setAvailableTime] = useState(120);
      const [paths, setPaths] = useState([]);
      const [resources, setResources] = useState([]);
      const [topics, setTopics] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [goals, setGoals] = useState([]);
      const [profileData, setProfileData] = useState({ fullName: '', avatar: '', age: '', field: '', interests: '' });
      const [refreshKey, setRefreshKey] = useState(0);

      const displayName = useMemo(() => {
        return profileData.fullName || currentUser?.user_metadata?.full_name || 'کاربر عزیز';
      }, [profileData, currentUser]);

      const displayAvatar = useMemo(() => {
        return profileData.avatar || currentUser?.user_metadata?.avatar || 'icon.jpg';
      }, [profileData, currentUser]);

      const totalStudiedMinutes = useMemo(() => {
        return sessions.reduce((sum, s) => sum + (s.durationMinutes || 0), 0);
      }, [sessions]);

      useEffect(() => {
        if (!supabaseClient) {
          setCheckingAuth(false);
          return;
        }

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (session && session.user) {
            setCurrentUser(session.user);
            const meta = session.user.user_metadata || {};
            setProfileData({
              fullName: meta.full_name || '',
              avatar: meta.avatar || 'icon.jpg',
              age: meta.age || '',
              field: meta.field || '',
              interests: meta.interests || ''
            });
            syncPull(session.user.id).then(() => loadLocalData());
          }
          setCheckingAuth(false);
        });

        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          if (session && session.user) {
            setCurrentUser(session.user);
          } else {
            setCurrentUser(null);
          }
        });

        return () => subscription?.unsubscribe();
      }, []);

      const loadLocalData = async () => {
        const [p, r, tp, t, s, g, prof] = await Promise.all([
          db.paths.toArray(),
          db.resources.toArray(),
          db.topics.toArray(),
          db.tasks.toArray(),
          db.sessions.toArray(),
          db.goals.toArray(),
          db.profile.get('user_profile')
        ]);
        setPaths(p);
        setResources(r);
        setTopics(tp);
        setTasks(t);
        setSessions(s);
        setGoals(g);
        if (prof) setProfileData(prof);
      };

      useEffect(() => {
        if (currentUser) loadLocalData();
      }, [refreshKey, currentUser]);

      const triggerRefresh = () => setRefreshKey(k => k + 1);

      const syncPush = async () => {
        if (!supabaseClient || !currentUser) return;
        const currentProf = await db.profile.get('user_profile') || profileData;
        const backup = {
          paths: await db.paths.toArray(),
          tasks: await db.tasks.toArray(),
          topics: await db.topics.toArray(),
          resources: await db.resources.toArray(),
          sessions: await db.sessions.toArray(),
          goals: await db.goals.toArray(),
          profile: currentProf
        };
        await supabaseClient.from('user_data').upsert({
          id: currentUser.id,
          data: backup,
          updated_at: new Date().toISOString()
        });
      };

      const syncPull = async (userId) => {
        const uid = userId || currentUser?.id;
        if (!supabaseClient || !uid) return;
        const { data, error } = await supabaseClient.from('user_data').select('data').eq('id', uid).single();
        if (error || !data || !data.data) return;
        const c = data.data;
        if (c.paths) await db.paths.bulkPut(c.paths);
        if (c.tasks) await db.tasks.bulkPut(c.tasks);
        if (c.topics) await db.topics.bulkPut(c.topics);
        if (c.resources) await db.resources.bulkPut(c.resources);
        if (c.sessions) await db.sessions.bulkPut(c.sessions);
        if (c.goals) await db.goals.bulkPut(c.goals);
        if (c.profile) {
          await db.profile.put({ id: 'user_profile', ...c.profile });
          setProfileData(c.profile);
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);

        if (password.length < 6) {
          setAuthError('رمز عبور باید حداقل ۶ کاراکتر باشد.');
          setAuthLoading(false);
          return;
        }

        try {
          if (authMode === 'register') {
            const enteredName = fullName.trim() || 'کاربر عزیز';
            const metaPayload = {
              full_name: enteredName,
              avatar: 'icon.jpg',
              age: age.trim(),
              field: field.trim(),
              interests: interests.trim()
            };

            const { data, error } = await supabaseClient.auth.signUp({
              email: email.trim(),
              password: password,
              options: { data: metaPayload }
            });

            if (error) throw error;
            if (data?.user) {
              setCurrentUser(data.user);
              await db.profile.put({ id: 'user_profile', ...metaPayload });
              setProfileData(metaPayload);
              await syncPull(data.user.id);
              loadLocalData();
            }
          } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: email.trim(),
              password: password
            });
            if (error) throw error;
            setCurrentUser(data.user);
            await syncPull(data.user.id);
            loadLocalData();
          }
        } catch (err) {
          setAuthError(err.message || 'خطا در ارتباط');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabaseClient.auth.signOut();
        setCurrentUser(null);
        await db.delete();
        await db.open();
        setPaths([]);
        setTasks([]);
        setSessions([]);
        setProfileData({ fullName: '', avatar: 'icon.jpg', age: '', field: '', interests: '' });
      };

      if (checkingAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[#FAF9FE]">
            <div className="bg-white border border-slate-200/80 shadow-2xl rounded-3xl p-6 sm:p-8 w-full max-w-md space-y-6">
              <div className="text-center space-y-2">
                <img src="icon.jpg" alt="Logo" className="w-16 h-16 rounded-2xl mx-auto shadow-md object-cover" />
                <h1 className="font-black text-slate-800 text-lg">Learning OS</h1>
                <p className="text-xs text-slate-400">ورود به سیستم‌عامل یادگیری</p>
              </div>

              {authError && (
                <div className="bg-rose-50 text-rose-700 text-xs p-3 rounded-2xl border border-rose-200">
                  {authError}
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-3 text-xs">
                {authMode === 'register' && (
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">نام و نام خانوادگی</label>
                    <input
                      type="text"
                      required
                      placeholder="نام شما..."
                      value={fullName}
                      onChange={e => setFullName(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-slate-600 font-bold mb-1">ایمیل</label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-left font-mono"
                    dir="ltr"
                  />
                </div>

                <div>
                  <label className="block text-slate-600 font-bold mb-1">رمز عبور</label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-left font-mono"
                    dir="ltr"
                  />
                </div>

                <button
                  type="submit"
                  disabled={authLoading}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg transition text-xs"
                >
                  {authMode === 'login' ? 'ورود به حساب' : 'ثبت‌نام و شروع'}
                </button>

                <div className="text-center pt-2">
                  <button
                    type="button"
                    onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                    className="text-xs text-indigo-600 font-bold"
                  >
                    {authMode === 'login' ? 'عضو نیستید؟ ثبت‌نام' : 'حساب دارید؟ ورود'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex bg-gradient-to-br from-[#FAF9FE] via-[#F4F3FB] to-[#F7F5FC]">
          {/* شاخه‌های زنده و در حال رشد دور کادر صفحه */}
          <LivingVineFrame studyMinutes={totalStudiedMinutes} />

          {/* سایدبار */}
          <aside className="hidden md:flex flex-col w-64 bg-white/80 backdrop-blur-xl border-l border-slate-200/80 p-6 justify-between fixed top-0 bottom-0 right-0 z-20">
            <div className="space-y-6">
              <div className="flex items-center gap-3">
                <img src={displayAvatar} alt={displayName} className="w-11 h-11 rounded-2xl object-cover border" />
                <div>
                  <h2 className="font-bold text-slate-800 text-sm">{displayName}</h2>
                  <span className="text-[11px] text-slate-400">سیستم‌عامل یادگیری</span>
                </div>
              </div>

              <nav className="space-y-1 text-xs">
                {[
                  { id: 'dashboard', label: 'داشبورد اصلی', icon: '🏠' },
                  { id: 'focus', label: 'اتاق تمرکز و همراه', icon: '⏱️' },
                  { id: 'tasks', label: 'برنامه روزانه', icon: '📋' },
                  { id: 'reports', label: 'پیشرفت و اهداف', icon: '📊' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setCurrentTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl font-bold transition ${
                      currentTab === item.id ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="space-y-2 border-t pt-4">
              <button
                onClick={handleLogout}
                className="w-full text-center text-xs text-rose-600 bg-rose-50 border border-rose-200 py-2 rounded-xl font-bold"
              >
                خروج از حساب
              </button>
            </div>
          </aside>

          {/* محتوای اصلی */}
          <main className="flex-1 md:mr-64 p-4 md:p-8 max-w-4xl mx-auto w-full space-y-6 pb-24 relative z-10">
            <header className="bg-white/80 backdrop-blur-md border border-slate-200/80 px-5 py-3 rounded-2xl flex items-center justify-between shadow-sm">
              <div className="text-xs font-bold text-slate-700 flex items-center gap-2">
                <span>{displayName} عزیز</span>
                <span className="text-[11px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
                  🌿 {totalStudiedMinutes} دقیقه تمرکز ثبت‌شده
                </span>
              </div>
              <button
                onClick={async () => { await syncPush(); alert('اطلاعات ذخیره شد ✨'); }}
                className="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-xl border border-indigo-200"
              >
                ☁️ ذخیره ابری
              </button>
            </header>

            {currentTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-l from-indigo-50 via-purple-50 to-pink-50 border border-purple-100 rounded-3xl p-6 shadow-sm flex items-center justify-between">
                  <div>
                    <h1 className="text-xl font-black text-slate-800">روزت پر از تمرکز و آرامش {displayName} جان 🌸</h1>
                    <p className="text-xs text-slate-500 mt-2">هر دقیقه تمرکز باعث رشد پیچک‌های اتاق مطالعه‌ات می‌شود.</p>
                  </div>
                  <button
                    onClick={() => setCurrentTab('focus')}
                    className="bg-indigo-600 text-white font-bold text-xs px-5 py-2.5 rounded-2xl shadow hover:bg-indigo-700"
                  >
                    ورود به اتاق مطالعه بانی ←
                  </button>
                </div>
              </div>
            )}

            {currentTab === 'focus' && (
              <FocusRoomView onSessionSaved={triggerRefresh} />
            )}

            {currentTab === 'tasks' && (
              <div className="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
                <h3 className="font-bold text-slate-800 text-sm">برنامه روزانه شما</h3>
                <p className="text-xs text-slate-400">تسک‌های خود را در این بخش مدیریت کنید.</p>
              </div>
            )}

            {currentTab === 'reports' && (
              <div className="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-slate-200/80 shadow-sm text-center space-y-2">
                <h3 className="font-bold text-slate-800 text-sm">مجموع زمان مطالعه: {totalStudiedMinutes} دقیقه</h3>
                <p className="text-xs text-slate-400">هر جلسه مطالعه در فضای ابری همگام‌سازی می‌شود.</p>
              </div>
            )}
          </main>

          {/* نوار موبایل */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white/90 backdrop-blur border-t border-slate-200 flex items-center justify-around z-30">
            {[
              { id: 'dashboard', label: 'خانه', icon: '🏠' },
              { id: 'focus', label: 'تمرکز', icon: '⏱️' },
              { id: 'tasks', label: 'برنامه', icon: '📋' },
              { id: 'reports', label: 'گزارش', icon: '📊' }
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setCurrentTab(item.id)}
                className={`flex flex-col items-center text-[10px] font-bold ${
                  currentTab === item.id ? 'text-indigo-600' : 'text-slate-400'
                }`}
              >
                <span className="text-base">{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
