<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Learning OS — سیستم‌عامل یادگیری</title>
  
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-title" content="Learning OS">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    /* انیمیشن رقص شاخه و برگ‌های زنده دور صفحه */
    @keyframes vineBreathe {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
      50% { transform: scale(1.025) rotate(0.8deg); opacity: 0.95; }
    }
    .vine-animation {
      animation: vineBreathe 6s ease-in-out infinite;
      transform-origin: top right;
    }

    /* شناوری المان‌های کمرنگ پس‌زمینه */
    @keyframes floatBG {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(2deg); }
    }
    .floating-bg {
      animation: floatBG 10s ease-in-out infinite;
    }

    /* شیشه مات مدرن */
    .glass-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body class="text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 overflow-x-hidden min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const db = new Dexie('LearningOS_Cognitive_DB');
    db.version(3).stores({
      paths: 'id, title, nature, priority',
      resources: 'id, pathId, title, type, content, url',
      topics: 'id, pathId, resourceId, title, isWeak, mastery, prereqTopicId',
      tasks: 'id, pathId, status, priority, isVital, scheduledDate',
      sessions: 'id, pathId, durationMinutes, timestamp',
      quizzes: 'id, topicId, score, timestamp',
      flashcards: 'id, topicId, front, back, step, nextReviewDate',
      goals: 'id, pathId, title, type, targetMonth, progress',
      calendarEvents: 'id, title, date, impactLevel',
      profile: 'id, fullName, avatar, age, field, interests'
    });

    const SUPABASE_URL = 'https://lwsndcosdmjxkhnhjhwx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6cS5z3_zbFNr0HN0u3ZD9A_c5uVewyV';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function getJalaliDate() {
      try {
        return new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(new Date());
      } catch (e) {
        return "امروز، روز یادگیری و پیشرفت";
      }
    }

    // صحنه‌های لوفای برای اتاق تمرکز
    const SCENES = [
      {
        id: 'rainy_cafe',
        title: 'کافه دنج بارانی',
        icon: '☕',
        videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-coffee-cup-and-rain-drops-on-window-42999-large.mp4',
        sound: 'https://actions.google.com/sounds/v1/weather/rain_heavy.ogg',
        characterGif: 'https://media.giphy.com/media/LmNwrBhejkK9EFP504/giphy.gif'
      },
      {
        id: 'lofi_night',
        title: 'اتاق مطالعه شبانه',
        icon: '🌙',
        videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-tree-branches-in-the-breeze-1188-large.mp4',
        sound: 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=lofi-study-112191.mp3',
        characterGif: 'https://media.giphy.com/media/f31DK1KpGCEva/giphy.gif'
      },
      {
        id: 'cozy_forest',
        title: 'جنگل و آب روان',
        icon: '🌿',
        videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-small-stream-in-the-forest-42898-large.mp4',
        sound: 'https://actions.google.com/sounds/v1/water/stream_water.ogg',
        characterGif: 'https://media.giphy.com/media/mGcNjsfWAjY5AEZNw6/giphy.gif'
      }
    ];

    // کامپوننت پس‌زمینه زنده و داینامیک کل اپلیکیشن
    function DynamicAtmosphere({ currentTab }) {
      return (
        <div className="fixed inset-0 pointer-events-none -z-10 overflow-hidden transition-all duration-1000">
          {/* گرادیان پایه بر اساس تب */}
          <div className={`absolute inset-0 transition-colors duration-1000 ${
            currentTab === 'focus' 
              ? 'bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950' 
              : currentTab === 'reports'
              ? 'bg-gradient-to-br from-[#F5F8FF] via-[#EEF2FF] to-[#FAF5FF]'
              : 'bg-gradient-to-br from-[#FAF8FE] via-[#F3F4FD] to-[#FCF8F9]'
          }`} />

          {/* شاخه پیچک و برگ‌های سبز زنده در گوشه بالای صفحه */}
          <div className="absolute -top-6 -right-6 w-72 sm:w-96 h-72 sm:h-96 vine-animation opacity-80 pointer-events-none">
            <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
              <path d="M400,0 C320,50 260,120 230,220 C210,290 150,340 50,380" stroke="#86efac" strokeWidth="4" strokeLinecap="round" opacity="0.6"/>
              <path d="M400,20 C340,80 300,160 270,250 C250,310 180,350 90,390" stroke="#4ade80" strokeWidth="2.5" strokeLinecap="round" opacity="0.4"/>
              
              {/* برگ‌های سبز لطیف */}
              <path d="M280,100 C270,80 290,65 310,75 C310,95 295,110 280,100 Z" fill="#86efac" opacity="0.75"/>
              <path d="M230,190 C215,180 220,160 240,165 C250,180 245,195 230,190 Z" fill="#4ade80" opacity="0.8"/>
              <path d="M190,260 C175,250 185,230 205,238 C210,255 200,268 190,260 Z" fill="#86efac" opacity="0.7"/>
              <path d="M110,335 C95,330 100,310 120,315 C130,330 125,342 110,335 Z" fill="#22c55e" opacity="0.65"/>
              
              {/* شکوفه صورتی ملایم */}
              <circle cx="232" cy="188" r="5" fill="#f472b6" opacity="0.85"/>
              <circle cx="192" cy="258" r="4" fill="#f472b6" opacity="0.75"/>
            </svg>
          </div>

          {/* حالت خاص تب گزارش‌ها: اعداد و چارت‌های هولوگرافیک محو شناور */}
          {currentTab === 'reports' && (
            <div className="absolute inset-0 floating-bg opacity-[0.06] flex items-center justify-around select-none">
              <span className="text-9xl font-black font-mono text-indigo-900">85%</span>
              <span className="text-8xl font-black font-mono text-indigo-900">∑</span>
              <span className="text-9xl font-black font-mono text-indigo-900">📈</span>
            </div>
          )}

          {/* حالت خاص تب تمرکز: ستاره‌ها و ذرات درخشان ملایم */}
          {currentTab === 'focus' && (
            <div className="absolute inset-0">
              <div className="absolute top-1/4 left-1/4 w-1.5 h-1.5 bg-amber-200 rounded-full animate-ping opacity-60"></div>
              <div className="absolute top-1/3 right-1/3 w-2 h-2 bg-indigo-300 rounded-full animate-pulse opacity-40"></div>
              <div className="absolute bottom-1/4 left-1/3 w-1.5 h-1.5 bg-purple-200 rounded-full animate-ping opacity-50"></div>
            </div>
          )}

          {/* حالت تب داشبورد و یادگیری: حباب‌های نورانی پاستلی */}
          {(currentTab === 'dashboard' || currentTab === 'paths' || currentTab === 'leitner') && (
            <div className="absolute inset-0 floating-bg pointer-events-none">
              <div className="absolute top-20 left-10 w-64 h-64 rounded-full bg-purple-200/25 blur-3xl"></div>
              <div className="absolute bottom-20 right-10 w-80 h-80 rounded-full bg-emerald-100/35 blur-3xl"></div>
              <div className="absolute top-1/2 left-1/2 w-96 h-96 rounded-full bg-indigo-100/30 blur-3xl"></div>
            </div>
          )}
        </div>
      );
    }

    // اتاق تمرکز زنده سینمایی با کنترل صدا و نوتیفیکیشن
    function FocusRoomView({ onSessionSaved }) {
      const [currentSceneIndex, setCurrentSceneIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [selectedDuration, setSelectedDuration] = useState(25);
      const [isRunning, setIsRunning] = useState(false);
      const [sessionSecondsPassed, setSessionSecondsPassed] = useState(0);
      const [volume, setVolume] = useState(0.6);
      const [isMuted, setIsMuted] = useState(false);
      const [notificationPermission, setNotificationPermission] = useState(
        typeof window !== 'undefined' && 'Notification' in window ? Notification.permission : 'default'
      );

      const audioRef = useRef(null);
      const activeScene = SCENES[currentSceneIndex];

      const sendNotification = (title, body) => {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'granted') {
          try {
            new Notification(title, { body, icon: 'icon.jpg' });
          } catch (e) {}
        }
      };

      const requestNotificationPermission = async () => {
        if (!('Notification' in window)) return;
        const perm = await Notification.requestPermission();
        setNotificationPermission(perm);
        if (perm === 'granted') {
          sendNotification('🔔 اعلان تمرکز فعال شد!', 'هنگام خروج از صفحه، اخطار بازگشت دریافت خواهید کرد.');
        }
      };

      useEffect(() => {
        const handleVisibility = () => {
          if (document.hidden && isRunning) {
            sendNotification('👀 کجا رفتی قهوه‌ت سرد شد!', 'جلسه مطالعه تو در حال سپری شدنه. برگرد به میز مطالعه ☕');
          }
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);
      }, [isRunning]);

      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft(prev => prev - 1);
            setSessionSecondsPassed(s => s + 1);
          }, 1000);
        } else if (timeLeft === 0 && isRunning) {
          handleComplete();
        }
        return () => clearInterval(interval);
      }, [isRunning, timeLeft]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.src = activeScene.sound;
          audioRef.current.volume = isMuted ? 0 : volume;
          if (isRunning && !isMuted) {
            audioRef.current.play().catch(() => {});
          } else {
            audioRef.current.pause();
          }
        }
      }, [activeScene, isRunning, isMuted]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : volume;
        }
      }, [volume, isMuted]);

      const handleSetTime = (mins) => {
        if (isRunning) return;
        setSelectedDuration(mins);
        setTimeLeft(mins * 60);
        setSessionSecondsPassed(0);
      };

      const handleReset = () => {
        setIsRunning(false);
        setTimeLeft(selectedDuration * 60);
        setSessionSecondsPassed(0);
      };

      const handleComplete = async () => {
        setIsRunning(false);
        const mins = Math.max(1, Math.round(sessionSecondsPassed / 60));
        
        await db.sessions.add({
          id: 'sess-' + Date.now(),
          durationMinutes: mins,
          timestamp: new Date().toISOString()
        });

        if (supabaseClient) {
          try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
              await supabaseClient.from('study_sessions').insert([{
                user_id: user.id,
                duration_minutes: mins
              }]);
            }
          } catch (e) {}
        }

        sendNotification('🎉 خسته نباشی قهرمان!', `${mins} دقیقه تمرکز عمیق پیوسته را با موفقیت تمام کردی.`);
        alert(`جلسه تمام شد! ${mins} دقیقه تمرکز عالی ثبت گردید ✨`);
        if (onSessionSaved) onSessionSaved();
        handleReset();
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="space-y-6 max-w-3xl mx-auto">
          <div className="relative rounded-3xl overflow-hidden shadow-2xl border border-slate-800 h-[480px] sm:h-[540px] flex flex-col justify-between p-6 select-none">
            <video 
              key={activeScene.videoUrl} 
              autoPlay 
              loop 
              muted 
              playsInline 
              className="absolute inset-0 w-full h-full object-cover z-0 filter brightness-[0.45] contrast-110"
            >
              <source src={activeScene.videoUrl} type="video/mp4" />
            </video>

            <div className={`absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-black/60 pointer-events-none transition-opacity duration-1000 z-0 ${
              isRunning ? 'opacity-80' : 'opacity-90'
            }`}></div>

            <div className="relative z-10 flex items-center justify-between">
              <div className="flex items-center gap-2 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-white/10">
                {SCENES.map((scene, idx) => (
                  <button
                    key={scene.id}
                    onClick={() => setCurrentSceneIndex(idx)}
                    className={`text-xs px-2.5 py-1 rounded-xl font-bold transition flex items-center gap-1.5 ${
                      currentSceneIndex === idx ? 'bg-white/25 text-white' : 'text-slate-300 hover:text-white'
                    }`}
                  >
                    <span>{scene.icon}</span>
                    <span className="hidden sm:inline">{scene.title}</span>
                  </button>
                ))}
              </div>

              {notificationPermission !== 'granted' && (
                <button
                  onClick={requestNotificationPermission}
                  className="bg-amber-500/20 text-amber-200 border border-amber-400/30 px-3 py-1.5 rounded-xl text-xs font-bold backdrop-blur-md hover:bg-amber-500/30 transition flex items-center gap-1"
                >
                  <span>🔔</span> فعال‌سازی اخطار خروج
                </button>
              )}
            </div>

            <div className="relative z-10 flex flex-col items-center justify-center my-auto">
              <div className="relative">
                <img 
                  src={activeScene.characterGif} 
                  alt="Study Companion"
                  className={`w-36 h-36 sm:w-44 sm:h-44 object-contain rounded-2xl drop-shadow-[0_15px_15px_rgba(0,0,0,0.6)] transition-all duration-700 ${
                    isRunning ? 'scale-105 filter brightness-105' : 'opacity-90 grayscale-[20%]'
                  }`}
                />
                {isRunning && (
                  <div className="absolute -top-3 right-2 w-3 h-3 bg-emerald-400 rounded-full animate-ping"></div>
                )}
              </div>
              <p className="text-white/85 text-xs font-bold mt-2 backdrop-blur-md bg-black/35 px-4 py-1.5 rounded-full border border-white/15">
                {isRunning ? '🤫 در حال مطالعه عمیق و بدون حواس‌پرتی...' : '☕ فضا آماده‌ست؛ وقتی شروع کنی ریتم زنده میشه'}
              </p>
            </div>

            <div className="relative z-10 bg-black/45 backdrop-blur-xl border border-white/15 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
              {!isRunning ? (
                <div className="flex items-center gap-1.5">
                  {[15, 25, 45, 60].map(m => (
                    <button
                      key={m}
                      onClick={() => handleSetTime(m)}
                      className={`text-xs px-3 py-1.5 rounded-xl font-bold transition ${
                        selectedDuration === m ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/30' : 'bg-white/10 text-slate-300 hover:bg-white/20'
                      }`}
                    >
                      {m}m
                    </button>
                  ))}
                </div>
              ) : (
                <div className="text-xs text-indigo-300 font-bold flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                  جلسه {selectedDuration} دقیقه‌ای
                </div>
              )}

              <div className="text-4xl sm:text-5xl font-black font-mono tracking-widest text-white drop-shadow-md">
                {formatTime(timeLeft)}
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsRunning(!isRunning)}
                  className={`px-6 py-2.5 rounded-xl text-xs font-bold text-white shadow-lg transition-all ${
                    isRunning ? 'bg-amber-500 hover:bg-amber-600 shadow-amber-500/30' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-600/30'
                  }`}
                >
                  {isRunning ? 'مکث ⏸' : 'شروع تمرکز ▶'}
                </button>

                {sessionSecondsPassed > 10 && (
                  <button
                    onClick={handleComplete}
                    className="p-2.5 bg-emerald-500/30 text-emerald-200 border border-emerald-400/30 rounded-xl hover:bg-emerald-500/40 text-xs"
                    title="ثبت موفق جلسه"
                  >
                    💾
                  </button>
                )}

                <button
                  onClick={handleReset}
                  className="p-2.5 bg-white/10 text-white/70 hover:text-white rounded-xl border border-white/10 text-xs"
                  title="تنظیم مجدد"
                >
                  🔄
                </button>

                <button
                  onClick={() => setIsMuted(!isMuted)}
                  className={`p-2.5 rounded-xl border text-xs transition ${
                    isMuted ? 'bg-rose-500/20 text-rose-300 border-rose-400/30' : 'bg-white/10 text-white border-white/10'
                  }`}
                  title="قطع/وصل صدا"
                >
                  {isMuted ? '🔇' : '🔊'}
                </button>
              </div>
            </div>

            <audio ref={audioRef} loop />
          </div>

          <div className="glass-card p-4 rounded-2xl shadow-sm flex items-center justify-between gap-4 text-xs">
            <span className="font-bold text-slate-700 flex items-center gap-1.5">
              <span>🎧</span> بلندی صدای محیط:
            </span>
            <input 
              type="range" 
              min="0" 
              max="1" 
              step="0.05"
              value={volume} 
              onChange={e => { setVolume(parseFloat(e.target.value)); setIsMuted(false); }}
              className="w-48 accent-indigo-600 cursor-pointer"
            />
          </div>
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [checkingAuth, setCheckingAuth] = useState(true);
      const [authMode, setAuthMode] = useState('login');

      const [fullName, setFullName] = useState('');
      const [age, setAge] = useState('');
      const [field, setField] = useState('');
      const [interests, setInterests] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      const [currentTab, setCurrentTab] = useState('dashboard');
      const [availableTimeMinutes, setAvailableTime] = useState(120);
      const [paths, setPaths] = useState([]);
      const [resources, setResources] = useState([]);
      const [topics, setTopics] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [quizzes, setQuizzes] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [goals, setGoals] = useState([]);
      const [profileData, setProfileData] = useState({ fullName: '', avatar: '', age: '', field: '', interests: '' });
      const [refreshKey, setRefreshKey] = useState(0);

      const displayName = useMemo(() => {
        return profileData.fullName || currentUser?.user_metadata?.full_name || 'کاربر عزیز';
      }, [profileData, currentUser]);

      const displayAvatar = useMemo(() => {
        return profileData.avatar || currentUser?.user_metadata?.avatar || 'icon.jpg';
      }, [profileData, currentUser]);

      const DAILY_QUOTES = useMemo(() => [
        `هر قدم کوچیکی که امروز برمی‌داری، پلی به سمت اهداف بزرگته ${displayName} جان 🌱`,
        "پیوستگی و ریتم آرام، یادگیری عمیق‌تری نسبت به ساعت‌های طولانی و پراکنده می‌سازه ✨",
        `به خودت افتخار کن که هر روز برای رشد مهارت‌هات وقت می‌ذاری ${displayName} عزیز 🌸`,
        "امروز با کیفیت و آرامش جلو برو؛ نتیجه‌ها در پس همین پیوستگی ظاهر می‌شن 🤍",
        "تعادل بین زندگی، استراحت و یادگیری، رمز ماندگاری این مسیره 🌿"
      ], [displayName]);

      useEffect(() => {
        if (!supabaseClient) {
          setCheckingAuth(false);
          return;
        }

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (session && session.user) {
            setCurrentUser(session.user);
            const meta = session.user.user_metadata || {};
            setProfileData({
              fullName: meta.full_name || '',
              avatar: meta.avatar || 'icon.jpg',
              age: meta.age || '',
              field: meta.field || '',
              interests: meta.interests || ''
            });
            syncPull(session.user.id).then(() => loadLocalData());
          }
          setCheckingAuth(false);
        });

        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          if (session && session.user) {
            setCurrentUser(session.user);
          } else {
            setCurrentUser(null);
          }
        });

        return () => subscription?.unsubscribe();
      }, []);

      const loadLocalData = async () => {
        const [p, r, tp, t, s, q, fc, g, prof] = await Promise.all([
          db.paths.toArray(),
          db.resources.toArray(),
          db.topics.toArray(),
          db.tasks.toArray(),
          db.sessions.toArray(),
          db.quizzes.toArray(),
          db.flashcards.toArray(),
          db.goals.toArray(),
          db.profile.get('user_profile')
        ]);
        setPaths(p);
        setResources(r);
        setTopics(tp);
        setTasks(t);
        setSessions(s);
        setQuizzes(q);
        setFlashcards(fc);
        setGoals(g);
        if (prof) setProfileData(prof);
      };

      useEffect(() => {
        if (currentUser) loadLocalData();
      }, [refreshKey, currentUser]);

      const triggerRefresh = () => setRefreshKey(k => k + 1);

      const syncPush = async () => {
        if (!supabaseClient || !currentUser) return;
        const currentProf = await db.profile.get('user_profile') || profileData;
        const backup = {
          paths: await db.paths.toArray(),
          tasks: await db.tasks.toArray(),
          topics: await db.topics.toArray(),
          resources: await db.resources.toArray(),
          flashcards: await db.flashcards.toArray(),
          quizzes: await db.quizzes.toArray(),
          sessions: await db.sessions.toArray(),
          goals: await db.goals.toArray(),
          profile: currentProf
        };
        await supabaseClient.from('user_data').upsert({
          id: currentUser.id,
          data: backup,
          updated_at: new Date().toISOString()
        });
      };

      const syncPull = async (userId) => {
        const uid = userId || currentUser?.id;
        if (!supabaseClient || !uid) return;
        const { data, error } = await supabaseClient.from('user_data').select('data').eq('id', uid).single();
        if (error || !data || !data.data) return;
        const c = data.data;
        if (c.paths) await db.paths.bulkPut(c.paths);
        if (c.tasks) await db.tasks.bulkPut(c.tasks);
        if (c.topics) await db.topics.bulkPut(c.topics);
        if (c.resources) await db.resources.bulkPut(c.resources);
        if (c.flashcards) await db.flashcards.bulkPut(c.flashcards);
        if (c.quizzes) await db.quizzes.bulkPut(c.quizzes);
        if (c.sessions) await db.sessions.bulkPut(c.sessions);
        if (c.goals) await db.goals.bulkPut(c.goals);
        if (c.profile) {
          await db.profile.put({ id: 'user_profile', ...c.profile });
          setProfileData(c.profile);
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);

        if (password.length < 6) {
          setAuthError('رمز عبور باید حداقل ۶ کاراکتر باشد.');
          setAuthLoading(false);
          return;
        }

        try {
          if (authMode === 'register') {
            const enteredName = fullName.trim() || 'کاربر عزیز';
            const metaPayload = {
              full_name: enteredName,
              avatar: 'icon.jpg',
              age: age.trim(),
              field: field.trim(),
              interests: interests.trim()
            };

            const { data, error } = await supabaseClient.auth.signUp({
              email: email.trim(),
              password: password,
              options: { data: metaPayload }
            });

            if (error) throw error;
            if (data?.user) {
              setCurrentUser(data.user);
              await db.profile.put({ id: 'user_profile', ...metaPayload });
              setProfileData(metaPayload);
              await syncPull(data.user.id);
              loadLocalData();
            }
          } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: email.trim(),
              password: password
            });
            if (error) throw error;
            setCurrentUser(data.user);
            await syncPull(data.user.id);
            loadLocalData();
          }
        } catch (err) {
          console.error(err);
          setAuthError(err.message || 'خطا در ارتباط');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabaseClient.auth.signOut();
        setCurrentUser(null);
        await db.delete();
        await db.open();
        setPaths([]);
        setTasks([]);
        setTopics([]);
        setGoals([]);
        setSessions([]);
        setProfileData({ fullName: '', avatar: 'icon.jpg', age: '', field: '', interests: '' });
      };

      const handleUpdateProfile = async (updatedData) => {
        setProfileData(updatedData);
        await db.profile.put({ id: 'user_profile', ...updatedData });
        
        if (supabaseClient && currentUser) {
          await supabaseClient.auth.updateUser({
            data: {
              full_name: updatedData.fullName,
              avatar: updatedData.avatar,
              age: updatedData.age,
              field: updatedData.field,
              interests: updatedData.interests
            }
          });
        }
        await syncPush();
        alert('پروفایل با موفقیت ذخیره شد ✨');
        triggerRefresh();
      };

      if (checkingAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center space-y-3">
              <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p className="text-xs font-bold text-slate-500">در حال بالا آمدن سیستم‌عامل...</p>
            </div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 py-8 relative">
            <DynamicAtmosphere currentTab="login" />
            <div className="glass-card shadow-2xl rounded-3xl p-6 sm:p-8 w-full max-w-md space-y-6">
              <div className="text-center space-y-2">
                <img src="icon.jpg" alt="Logo" className="w-16 h-16 rounded-2xl mx-auto shadow-md object-cover" />
                <h1 className="font-black text-slate-800 text-lg">Learning OS</h1>
                <p className="text-xs text-slate-400">
                  {authMode === 'register' ? 'مشخصات خود را وارد کنید تا مشاور شما را بشناسد' : 'ورود به حساب کاربری شخصی'}
                </p>
              </div>

              {authError && (
                <div className="bg-rose-50/90 border border-rose-200 text-rose-700 text-xs p-3 rounded-2xl">
                  {authError}
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-3 text-xs">
                {authMode === 'register' && (
                  <>
                    <div className="grid grid-cols-3 gap-2">
                      <div className="col-span-2">
                        <label className="block text-slate-600 font-bold mb-1">نام و نام خانوادگی</label>
                        <input
                          type="text"
                          required
                          placeholder="مثلاً: محبوبه..."
                          value={fullName}
                          onChange={e => setFullName(e.target.value)}
                          className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-600 font-bold mb-1">سن</label>
                        <input
                          type="number"
                          placeholder="مثلاً: ۲۵"
                          value={age}
                          onChange={e => setAge(e.target.value)}
                          className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs text-center"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-600 font-bold mb-1">رشته تحصیلی یا حوزه اصلی فعالیت</label>
                      <input
                        type="text"
                        placeholder="مثلاً: روانشناسی، آموزش، طراحی..."
                        value={field}
                        onChange={e => setField(e.target.value)}
                        className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-600 font-bold mb-1">مهارت‌ها و علاقه‌مندی‌های هدف</label>
                      <textarea
                        rows="2"
                        placeholder="مثلاً: رفرنس‌های بالینی، طراحی Canva، زبان..."
                        value={interests}
                        onChange={e => setInterests(e.target.value)}
                        className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs leading-relaxed"
                      />
                    </div>
                  </>
                )}

                <div>
                  <label className="block text-slate-600 font-bold mb-1">پست الکترونیک (ایمیل)</label>
                  <input
                    type="email"
                    required
                    placeholder="name@example.com"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-left font-mono text-xs"
                    dir="ltr"
                  />
                </div>

                <div>
                  <label className="block text-slate-600 font-bold mb-1">رمز عبور (حداقل ۶ کاراکتر)</label>
                  <input
                    type="password"
                    required
                    placeholder="••••••••"
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-left font-mono text-xs"
                    dir="ltr"
                  />
                </div>

                <button
                  type="submit"
                  disabled={authLoading}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-200 transition disabled:opacity-50 text-xs mt-2"
                >
                  {authLoading ? 'در حال برقراری ارتباط...' : (authMode === 'login' ? 'ورود به سیستم‌عامل' : 'تکمیل ثبت‌نام و شناخت مشاور ✨')}
                </button>

                <div className="text-center pt-2">
                  <button
                    type="button"
                    onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                    className="text-xs text-indigo-600 font-bold hover:underline"
                  >
                    {authMode === 'login' ? 'حساب کاربری ندارید؟ ثبت‌نام و تکمیل شناخت' : 'قبلاً عضو شده‌اید؟ ورود'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex relative">
          {/* تزریق پس‌زمینه زنده و متغیر */}
          <DynamicAtmosphere currentTab={currentTab} />

          {/* منوی سایدبار شیشه‌ای */}
          <aside className="hidden md:flex flex-col w-64 glass-card border-l border-white/60 p-6 justify-between fixed top-0 bottom-0 right-0 z-20 shadow-sm">
            <div className="space-y-6">
              <div className="flex items-center gap-3">
                <img src={displayAvatar} alt={displayName} className="w-11 h-11 rounded-2xl object-cover border border-indigo-100 shadow-sm" />
                <div className="min-w-0">
                  <h2 className="font-bold text-slate-800 text-sm truncate">{displayName}</h2>
                  <span className="text-[11px] text-slate-400 truncate block">
                    {profileData.field ? profileData.field : 'سیستم‌عامل یادگیری'}
                  </span>
                </div>
              </div>

              <nav className="space-y-1 text-xs">
                {[
                  { id: 'dashboard', label: 'داشبورد اصلی', icon: '🏠' },
                  { id: 'focus', label: 'اتاق تمرکز و همراه', icon: '⏱️' },
                  { id: 'paths', label: 'مسیرهای یادگیری', icon: '📚' },
                  { id: 'clipper', label: 'استخراج وب و لینک‌ها', icon: '🌐' },
                  { id: 'tasks', label: 'برنامه روزانه (WHAT)', icon: '📋' },
                  { id: 'leitner', label: 'جعبه لایتنر هوشمند', icon: '🗂️' },
                  { id: 'recovery', label: 'اتاق ریکاوری و عقب‌افتاده', icon: '🛋️' },
                  { id: 'assistant', label: 'مشاور و دستیار هوشمند', icon: '🌸' },
                  { id: 'reports', label: 'پیشرفت و اهداف ماهانه', icon: '📊' },
                  { id: 'profile', label: 'پروفایل و علایق شناختی', icon: '⚙️' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setCurrentTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl font-bold transition ${
                      currentTab === item.id 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' 
                        : 'text-slate-600 hover:bg-white/60'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="space-y-2 border-t border-slate-200/60 pt-4">
              <div className="text-[11px] text-slate-400 font-mono truncate">{currentUser.email}</div>
              <button
                onClick={handleLogout}
                className="w-full text-center text-xs text-rose-600 bg-rose-50/80 border border-rose-200 py-2 rounded-xl font-bold hover:bg-rose-100 transition mt-2"
              >
                خروج از حساب
              </button>
            </div>
          </aside>

          <main className="flex-1 md:mr-64 flex flex-col min-w-0">
            <header className="glass-card border-b border-white/60 px-4 md:px-8 py-3 flex items-center justify-between sticky top-0 z-10">
              <div className="text-xs font-bold text-slate-700 flex items-center gap-2.5">
                <img src={displayAvatar} alt={displayName} className="w-7 h-7 rounded-full object-cover border border-white" />
                <span>{displayName} {profileData.field && <span className="text-slate-400 font-normal">({profileData.field})</span>}</span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={async () => { await syncPush(); alert('اطلاعات با سرور ابری همگام شد ✅'); }}
                  className="bg-indigo-50/90 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-xl border border-indigo-200 hover:bg-indigo-100 transition"
                >
                  ☁️ ذخیره ابری
                </button>
                <button
                  onClick={() => setCurrentTab('profile')}
                  className="text-xs text-slate-600 bg-white/70 px-3 py-1.5 rounded-xl font-bold hover:bg-white border border-slate-200/60 transition"
                >
                  ⚙️ پروفایل
                </button>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-4xl mx-auto w-full space-y-6 pb-24 md:pb-12">
              {currentTab === 'dashboard' && (
                <DashboardView
                  displayName={displayName}
                  displayAvatar={displayAvatar}
                  quotes={DAILY_QUOTES}
                  paths={paths}
                  tasks={tasks}
                  topics={topics}
                  goals={goals}
                  availableTimeMinutes={availableTimeMinutes}
                  setAvailableTime={setAvailableTime}
                  onGoToFocus={() => setCurrentTab('focus')}
                  triggerRefresh={() => { triggerRefresh(); syncPush(); }}
                />
              )}

              {currentTab === 'focus' && (
                <FocusRoomView onSessionSaved={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'paths' && (
                <PathsUniversalView paths={paths} topics={topics} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'clipper' && (
                <WebClipperView paths={paths} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'tasks' && (
                <TasksView paths={paths} tasks={tasks} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'leitner' && (
                <LeitnerView topics={topics} flashcards={flashcards} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'recovery' && (
                <RecoveryLoungeView displayName={displayName} tasks={tasks} topics={topics} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'assistant' && (
                <CounselorAssistantView
                  displayName={displayName}
                  profileData={profileData}
                  paths={paths}
                  topics={topics}
                  goals={goals}
                  triggerRefresh={() => { triggerRefresh(); syncPush(); }}
                />
              )}

              {currentTab === 'reports' && (
                <ReportsView displayName={displayName} sessions={sessions} goals={goals} topics={topics} />
              )}

              {currentTab === 'profile' && (
                <ProfileSettingsView
                  initialData={profileData}
                  onSave={handleUpdateProfile}
                />
              )}
            </div>
          </main>

          {/* منوی پایین موبایل */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 glass-card border-t border-white/80 flex items-center justify-around px-1 z-30 shadow-lg">
            {[
              { id: 'dashboard', label: 'خانه', icon: '🏠' },
              { id: 'focus', label: 'تمرکز', icon: '⏱️' },
              { id: 'tasks', label: 'برنامه', icon: '📋' },
              { id: 'assistant', label: 'مشاور', icon: '🌸' },
              { id: 'profile', label: 'پروفایل', icon: '⚙️' }
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setCurrentTab(item.id)}
                className={`flex flex-col items-center gap-1 text-[10px] font-bold ${
                  currentTab === item.id ? 'text-indigo-600' : 'text-slate-400'
                }`}
              >
                <span className="text-sm">{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    function ProfileSettingsView({ initialData, onSave }) {
      const [fullName, setFullName] = useState(initialData.fullName || '');
      const [avatar, setAvatar] = useState(initialData.avatar || 'icon.jpg');
      const [age, setAge] = useState(initialData.age || '');
      const [field, setField] = useState(initialData.field || '');
      const [interests, setInterests] = useState(initialData.interests || '');

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          alert('حجم عکس حداکثر ۲ مگابایت باشد.');
          return;
        }

        const reader = new FileReader();
        reader.onloadend = () => setAvatar(reader.result);
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ fullName, avatar, age, field, interests });
      };

      return (
        <div className="glass-card p-6 sm:p-8 rounded-3xl shadow-sm max-w-xl mx-auto space-y-6">
          <div className="border-b border-slate-200/60 pb-4">
            <h2 className="font-bold text-slate-800 text-base">پروفایل شناختی و تنظیمات نمایه</h2>
            <p className="text-xs text-slate-400 mt-1">مشاور هوشمند با بررسی این فیلدها، برنامه‌ها را متناسب با شما تنظیم می‌کند.</p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-4 text-xs">
            <div className="flex flex-col sm:flex-row items-center gap-5 pb-3 border-b border-slate-200/60">
              <img src={avatar} alt="Profile" className="w-20 h-20 rounded-3xl object-cover border-2 border-indigo-500 shadow-md" />
              <div className="space-y-1.5 text-center sm:text-right">
                <label className="block text-slate-700 font-bold">آپلود عکس جدید از دستگاه:</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handleImageUpload}
                  className="block w-full text-xs text-slate-500 file:mr-0 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"
                />
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2">
              <div className="col-span-2">
                <label className="block text-slate-700 font-bold mb-1">نام و نام خانوادگی:</label>
                <input
                  type="text"
                  required
                  value={fullName}
                  onChange={e => setFullName(e.target.value)}
                  className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 font-bold text-slate-800"
                />
              </div>
              <div>
                <label className="block text-slate-700 font-bold mb-1">سن:</label>
                <input
                  type="number"
                  value={age}
                  onChange={e => setAge(e.target.value)}
                  className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-center"
                />
              </div>
            </div>

            <div>
              <label className="block text-slate-700 font-bold mb-1">رشته تحصیلی یا حوزه اصلی:</label>
              <input
                type="text"
                value={field}
                onChange={e => setField(e.target.value)}
                className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600"
              />
            </div>

            <div>
              <label className="block text-slate-700 font-bold mb-1">مهارت‌ها و علاقه‌مندی‌های هدف:</label>
              <textarea
                rows="3"
                value={interests}
                onChange={e => setInterests(e.target.value)}
                className="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 leading-relaxed"
              />
            </div>

            <button
              type="submit"
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-md shadow-indigo-100 transition text-xs mt-2"
            >
              ذخیره تغییرات نمایه و به‌روزرسانی مشاور ✓
            </button>
          </form>
        </div>
      );
    }

    function CounselorAssistantView({ displayName, profileData, paths, topics, goals, triggerRefresh }) {
      const [input, setInput] = useState('');
      
      const initialGreeting = useMemo(() => {
        let text = `سلام ${displayName} جانم! 🌸 من اینجام؛ مثل یک دوست و مشاور یادگیری همگام با تو.`;
        if (profileData.field) {
          text += ` با توجه به تمرکزت در حوزه «${profileData.field}»`;
        }
        if (profileData.interests) {
          text += ` و علایق هدف [${profileData.interests}]، برنامه‌ت رو سبک، دقیق و پیوسته می‌چینیم.`;
        } else {
          text += ` هر هدفی برای این ماه داری بنویس تا با هم خردش کنیم.`;
        }
        return text;
      }, [displayName, profileData]);

      const [messages, setMessages] = useState([
        { id: '1', sender: 'counselor', text: initialGreeting }
      ]);

      const handleSend = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        const text = input.trim();
        setMessages(prev => [...prev, { id: 'u-' + Date.now(), sender: 'user', text }]);
        setInput('');

        setTimeout(() => {
          let reply = '';
          if (text.includes('مهمون') || text.includes('خسته') || text.includes('وقت ندارم')) {
            reply = `${displayName} عزیزم، آرامش و زندگی اولویت اوله 🌸 برنامه رو بردم روی حالت «حفظ پیوستگی کم‌فشار». فقط ۱۰ دقیقه مطالعه هم کافیه تا ریتم حفظ بشه.`;
          } else if (text.includes('هدف') || text.includes('می‌خوام')) {
            reply = `هدف فوق‌العاده‌ایه ${displayName} جان! 🎯 بر اساس زمینه تخصصی‌ت، اون رو خرد کردم و آماده تیک زدن در داشبورد گذاشتم.`;
          } else {
            reply = `پیامت دریافت شد ${displayName} جان 🌸 همراهتم تا با ریتم پایدار و بدون فرسودگی مهارت‌هات رو ارتقا بدی.`;
          }
          setMessages(prev => [...prev, { id: 'c-' + Date.now(), sender: 'counselor', text: reply }]);
        }, 400);
      };

      return (
        <div className="glass-card rounded-3xl shadow-sm flex flex-col h-[520px]">
          <div className="p-4 border-b border-slate-200/60 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-xl">🌸</span>
              <div>
                <h3 className="font-bold text-slate-800 text-xs">مشاور و همراه هوشمند</h3>
                <span className="text-[10px] text-emerald-600 font-bold">● متصل به علایق {displayName}</span>
              </div>
            </div>
            {profileData.field && (
              <span className="text-[11px] text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-0.5 rounded-full font-bold">
                حوزه: {profileData.field}
              </span>
            )}
          </div>

          <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
            {messages.map(m => (
              <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] p-3.5 rounded-2xl whitespace-pre-wrap leading-relaxed ${m.sender === 'user' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white/90 text-slate-800 border'}`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          <form onSubmit={handleSend} className="p-3 border-t border-slate-200/60 flex gap-2">
            <input
              type="text"
              placeholder="پیام یا هدف جدیدت رو اینجا بنویس..."
              value={input}
              onChange={e => setInput(e.target.value)}
              className="flex-1 bg-white/80 border border-slate-200 rounded-2xl px-4 py-2.5 text-xs focus:outline-none"
            />
            <button type="submit" className="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-2xl text-xs hover:bg-indigo-700 shadow-md">ارسال</button>
          </form>
        </div>
      );
    }

    function DashboardView({ displayName, displayAvatar, quotes, paths, tasks, topics, goals, availableTimeMinutes, setAvailableTime, onGoToFocus, triggerRefresh }) {
      const todayDate = useMemo(() => getJalaliDate(), []);
      const quote = useMemo(() => quotes[new Date().getDate() % quotes.length], [quotes]);

      const topTask = useMemo(() => {
        const pending = tasks.filter(t => t.status !== 'done');
        return pending.find(t => t.isVital || t.priority === 'critical') || pending[0];
      }, [tasks]);

      const toggleTask = async (task) => {
        const next = task.status === 'done' ? 'not_started' : 'done';
        await db.tasks.update(task.id, { status: next });
        triggerRefresh();
      };

      const filteredTasks = useMemo(() => {
        let acc = 0;
        return tasks.filter(t => {
          if (t.status === 'done') return true;
          if (acc + (t.estimatedMinutes || 30) <= availableTimeMinutes) {
            acc += (t.estimatedMinutes || 30);
            return true;
          }
          return false;
        });
      }, [tasks, availableTimeMinutes]);

      return (
        <div className="space-y-6">
          <div className="glass-card rounded-3xl p-6 shadow-sm flex items-center justify-between gap-4 border border-white/80">
            <div>
              <div className="flex items-center gap-2 text-indigo-700 text-xs font-bold mb-1">
                <span>📅</span>
                <span>{todayDate}</span>
              </div>
              <h1 className="text-xl md:text-2xl font-black text-slate-800">
                سلام {displayName} جان! روزت سرشار از آرامش 🌸
              </h1>
              <p className="text-xs md:text-sm text-slate-600 mt-2">«{quote}»</p>
            </div>
            <img src={displayAvatar} alt={displayName} className="w-16 h-16 md:w-20 md:h-20 rounded-3xl object-cover border-2 border-white shadow-md hidden sm:block" />
          </div>

          <div className="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 text-white p-5 rounded-3xl shadow-xl shadow-indigo-200/50 flex items-center justify-between">
            <div className="space-y-1">
              <h3 className="font-black text-sm flex items-center gap-2">
                <span>⏱️</span> ورود به اتاق تمرکز و فضای سینمایی لوفای
              </h3>
              <p className="text-xs text-indigo-100">کافه دنج بارانی، نوای آب جاری و همراه پویا منتظر تو هستند.</p>
            </div>
            <button 
              onClick={onGoToFocus}
              className="bg-white text-indigo-700 font-black text-xs px-4 py-2.5 rounded-xl shadow hover:bg-indigo-50 transition"
            >
              شروع جلسه تمرکز ←
            </button>
          </div>

          {topTask && (
            <div className="glass-card rounded-3xl p-5 shadow-sm relative overflow-hidden border-2 border-indigo-100">
              <div className="absolute top-0 right-0 w-2 h-full bg-indigo-600"></div>
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <span className="text-indigo-700 text-[11px] font-bold bg-indigo-50 px-2.5 py-1 rounded-full">
                    🧠 پیشنهاد مشاور: الان بهترین کار برای تو:
                  </span>
                  <h3 className="font-bold text-slate-800 text-sm mt-2">{topTask.title}</h3>
                  <span className="text-xs text-slate-400 mt-0.5 block">⏱ تخمین: {topTask.estimatedMinutes || 30} دقیقه</span>
                </div>
                <button
                  onClick={() => toggleTask(topTask)}
                  className="bg-indigo-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-indigo-700 transition shadow"
                >
                  انجام شد ✓
                </button>
              </div>
            </div>
          )}

          <div className="glass-card rounded-3xl p-6 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div>
                <h3 className="font-bold text-slate-800 text-sm">امروز چقدر زمان در اختیار داری؟</h3>
                <p className="text-xs text-slate-400">سیستم حجم مناسب را بر اساس فرصت شما می‌چیند.</p>
              </div>
              <div className="flex items-center gap-1.5 bg-white/70 p-1.5 rounded-2xl border border-slate-200">
                {[30, 60, 90, 120, 180].map(m => (
                  <button
                    key={m}
                    onClick={() => setAvailableTime(m)}
                    className={`px-3 py-1 rounded-xl text-xs font-bold transition ${
                      availableTimeMinutes === m ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    {m} دقیقه
                  </button>
                ))}
              </div>
            </div>

            <div className="space-y-2">
              {filteredTasks.length === 0 ? (
                <div className="text-center py-6 text-xs text-slate-400">تسک فعالی برای امروز تعریف نشده است.</div>
              ) : (
                filteredTasks.map(t => (
                  <div key={t.id} className="flex items-center justify-between p-3.5 bg-white/80 rounded-2xl border border-slate-100 text-xs">
                    <div className="flex items-center gap-3">
                      <input
                        type="checkbox"
                        checked={t.status === 'done'}
                        onChange={() => toggleTask(t)}
                        className="w-4 h-4 accent-indigo-600 rounded"
                      />
                      <span className={`font-bold ${t.status === 'done' ? 'line-through text-slate-400' : 'text-slate-700'}`}>
                        {t.title}
                      </span>
                    </div>
                    <span className="text-slate-400">⏱ {t.estimatedMinutes || 30} دقیقه</span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    function WebClipperView({ paths, triggerRefresh }) {
      const [url, setUrl] = useState('');
      const [pathId, setPathId] = useState(paths[0]?.id || '');
      const [title, setTitle] = useState('');
      const [extractedContent, setExtractedContent] = useState('');
      const [isExtracting, setIsExtracting] = useState(false);

      const handleClipper = (e) => {
        e.preventDefault();
        if (!url) return;
        setIsExtracting(true);
        setTimeout(() => {
          const sampleText = `این نسخه استخراج‌شده از لینک (${url}) است.\nمفاهیم کلیدی، تعاریف و نکات بدون تبلیغات ثبت شدند.`;
          setExtractedContent(sampleText);
          setIsExtracting(false);
        }, 600);
      };

      const handleSaveResource = async () => {
        if (!pathId || !extractedContent) return;
        await db.resources.add({
          id: 'res-' + Date.now(),
          pathId,
          title: title || 'مقاله آنلاین',
          type: 'web_article',
          content: extractedContent,
          url
        });
        alert('منبع در رفرنس‌های شما ذخیره شد ✨');
        setUrl('');
        setTitle('');
        setExtractedContent('');
        triggerRefresh();
      };

      return (
        <div className="space-y-6">
          <div className="glass-card p-6 rounded-3xl shadow-sm space-y-3">
            <h3 className="font-bold text-slate-800 text-sm">استخراج مقالات و منابع وب</h3>
            <form onSubmit={handleClipper} className="space-y-3 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input
                  type="url"
                  placeholder="آدرس اینترنتی (URL)..."
                  value={url}
                  onChange={e => setUrl(e.target.value)}
                  className="bg-white/80 border p-2.5 rounded-xl focus:outline-none"
                  required
                />
                <input
                  type="text"
                  placeholder="عنوان منبع..."
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  className="bg-white/80 border p-2.5 rounded-xl focus:outline-none"
                />
              </div>
              <div className="flex items-center justify-between gap-3">
                <select
                  value={pathId}
                  onChange={e => setPathId(e.target.value)}
                  className="bg-white/80 border p-2.5 rounded-xl text-xs flex-1"
                >
                  <option value="">انتخاب مسیر یادگیری...</option>
                  {paths.map(p => (
                    <option key={p.id} value={p.id}>{p.icon} {p.title}</option>
                  ))}
                </select>
                <button
                  type="submit"
                  disabled={isExtracting}
                  className="bg-indigo-600 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition shadow"
                >
                  {isExtracting ? 'در حال پردازش...' : 'استخراج محتوا ⚡'}
                </button>
              </div>
            </form>
          </div>

          {extractedContent && (
            <div className="glass-card p-6 rounded-3xl border border-emerald-300 space-y-4">
              <div className="p-4 bg-white/90 rounded-2xl text-xs text-slate-700 whitespace-pre-wrap leading-relaxed border">
                {extractedContent}
              </div>
              <button
                onClick={handleSaveResource}
                className="bg-emerald-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl hover:bg-emerald-700 transition shadow"
              >
                ذخیره در رفرنس‌های این مهارت ✓
              </button>
            </div>
          )}
        </div>
      );
    }

    function LeitnerView({ topics, flashcards, triggerRefresh }) {
      const [front, setFront] = useState('');
      const [back, setBack] = useState('');
      const [selectedTopicId, setSelectedTopicId] = useState(topics[0]?.id || '');
      const [revealedCardId, setRevealedCardId] = useState(null);

      const handleAddCard = async (e) => {
        e.preventDefault();
        if (!front || !back || !selectedTopicId) return;
        await db.flashcards.add({
          id: 'fc-' + Date.now(),
          topicId: selectedTopicId,
          front,
          back,
          step: 1,
          nextReviewDate: new Date().toISOString().split('T')[0]
        });
        setFront('');
        setBack('');
        triggerRefresh();
      };

      const handleRateCard = async (card, success) => {
        const nextStep = success ? card.step + 1 : 1;
        await db.flashcards.update(card.id, {
          step: nextStep,
          nextReviewDate: new Date(Date.now() + nextStep * 86400000 * 2).toISOString().split('T')[0]
        });
        setRevealedCardId(null);
        triggerRefresh();
      };

      return (
        <div className="space-y-6">
          <form onSubmit={handleAddCard} className="glass-card p-5 rounded-3xl shadow-sm space-y-3 text-xs">
            <h3 className="font-bold text-slate-800 text-sm">افزودن فلش‌کارت مرور فواصل‌دار</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <input
                type="text"
                placeholder="روی کارت (سوال / مفهوم کلیدی)..."
                value={front}
                onChange={e => setFront(e.target.value)}
                className="bg-white/80 border p-2.5 rounded-xl"
                required
              />
              <input
                type="text"
                placeholder="پشت کارت (پاسخ / توضیح)..."
                value={back}
                onChange={e => setBack(e.target.value)}
                className="bg-white/80 border p-2.5 rounded-xl"
                required
              />
            </div>
            <div className="flex items-center justify-between gap-3">
              <select
                value={selectedTopicId}
                onChange={e => setSelectedTopicId(e.target.value)}
                className="bg-white/80 border p-2 rounded-xl flex-1 text-xs"
              >
                {topics.map(t => (
                  <option key={t.id} value={t.id}>{t.title}</option>
                ))}
              </select>
              <button type="submit" className="bg-indigo-600 text-white font-bold px-6 py-2 rounded-xl hover:bg-indigo-700 transition shadow">
                ثبت کارت
              </button>
            </div>
          </form>

          <div className="space-y-3">
            <h4 className="font-bold text-slate-800 text-xs">کارت‌های آماده مرور ({flashcards.length})</h4>
            {flashcards.length === 0 ? (
              <div className="glass-card p-8 rounded-3xl text-center text-xs text-slate-400">
                جعبه لایتنر فعلاً خالی است.
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {flashcards.map(fc => (
                  <div key={fc.id} className="glass-card p-5 rounded-3xl shadow-sm space-y-3 text-xs">
                    <div className="font-bold text-slate-800">{fc.front}</div>
                    {revealedCardId === fc.id ? (
                      <div className="p-3 bg-indigo-50/80 rounded-xl text-indigo-900 border border-indigo-100">
                        {fc.back}
                      </div>
                    ) : (
                      <button onClick={() => setRevealedCardId(fc.id)} className="text-[11px] text-indigo-600 font-bold hover:underline block">
                        نمایش پاسخ کارت 👁️
                      </button>
                    )}
                    {revealedCardId === fc.id && (
                      <div className="flex justify-end gap-2 pt-2 border-t">
                        <button onClick={() => handleRateCard(fc, false)} className="bg-rose-50 text-rose-700 px-3 py-1.5 rounded-xl font-bold border border-rose-200">
                          نیاز به تکرار
                        </button>
                        <button onClick={() => handleRateCard(fc, true)} className="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-xl font-bold border border-emerald-200">
                          مسلط بودم ✓
                        </button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    }

    function ReportsView({ displayName, sessions, goals, topics }) {
      const totalMinutes = sessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);
      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
            <div className="glass-card p-5 rounded-3xl shadow-sm">
              <span className="text-xs text-slate-400 font-bold">مجموع زمان مطالعه</span>
              <div className="text-2xl font-black text-indigo-600 mt-1">{totalMinutes} دقیقه</div>
            </div>
            <div className="glass-card p-5 rounded-3xl shadow-sm">
              <span className="text-xs text-slate-400 font-bold">جلسات مطالعه</span>
              <div className="text-2xl font-black text-slate-800 mt-1">{sessions.length} جلسه</div>
            </div>
            <div className="glass-card p-5 rounded-3xl shadow-sm">
              <span className="text-xs text-slate-400 font-bold">اهداف فعال</span>
              <div className="text-2xl font-black text-emerald-600 mt-1">{goals.length} هدف</div>
            </div>
          </div>
          
          <div className="glass-card p-6 rounded-3xl shadow-sm space-y-3">
            <h4 className="font-bold text-slate-800 text-sm">وضعیت اهداف این ماه {displayName}</h4>
            {goals.length === 0 ? (
              <div className="text-center py-6 text-xs text-slate-400">هنوز هدفی ثبت نشده است.</div>
            ) : (
              goals.map(g => (
                <div key={g.id} className="p-3.5 bg-white/80 rounded-2xl border border-slate-100 space-y-1 text-xs">
                  <div className="flex items-center justify-between font-bold text-slate-800">
                    <span>🎯 {g.title}</span>
                    <span className="text-indigo-600">{g.progress}% پیشرفت</span>
                  </div>
                  <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                    <div className="bg-indigo-600 h-full rounded-full" style={{ width: `${g.progress}%` }}></div>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
