    function FloatingLivingPetsWidget({ activeCompanion, setActiveCompanion }) {
      const [currentMsg, setCurrentMsg] = useState(null);

          {companion.videoUrl ? (

          )}

          {petMessage && (

    function FocusRoomView({ activeCompanion, setActiveCompanion, onSessionSaved }) {
      const [isSelecting, setIsSelecting] = useState(false);
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [selectedMinutes, setSelectedMinutes] = useState(25);
      const [isRunning, setIsRunning] = useState(false);
      const [sessionSecondsPassed, setSessionSecondsPassed] = useState(0);
      const [activeSound, setActiveSound] = useState('rain');
      const [volume, setVolume] = useState(0.5);
      const audioRef = useRef(null);

      const SOUNDS = {
        rain: { title: 'باران دنج', icon: '🌧️', url: 'https://actions.google.com/sounds/v1/weather/rain_heavy.ogg' },
        stream: { title: 'آب و رودخانه', icon: '🌊', url: 'https://actions.google.com/sounds/v1/water/stream_water.ogg' },
        wind: { title: 'نویز سفید برگ‌ها', icon: '🍃', url: 'https://actions.google.com/sounds/v1/weather/light_wind_trees.ogg' },
        cafe: { title: 'کافه خلوت', icon: '☕', url: 'https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg' }
      };

      useEffect(() => {
        if (audioRef.current) {
          if (isRunning && activeSound) {
            audioRef.current.src = SOUNDS[activeSound].url;
            audioRef.current.volume = volume;
            audioRef.current.play().catch(() => {});
          } else {
            audioRef.current.pause();
          }
        }
      }, [isRunning, activeSound]);

      useEffect(() => {
        if (audioRef.current) audioRef.current.volume = volume;
      }, [volume]);

      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft(prev => prev - 1);
            setSessionSecondsPassed(s => s + 1);
          }, 1000);
        } else if (timeLeft === 0 && isRunning) {
          handleComplete();
        }
        return () => clearInterval(interval);
      }, [isRunning, timeLeft]);

      const handleSetDuration = (m) => {
        if (isRunning) return;
        setSelectedMinutes(m);
        setTimeLeft(m * 60);
        setSessionSecondsPassed(0);
      };

      const handleReset = () => {
        setIsRunning(false);
        setTimeLeft(selectedMinutes * 60);
        setSessionSecondsPassed(0);
      };

      const handleComplete = async () => {
        setIsRunning(false);
        const mins = Math.max(1, Math.round(sessionSecondsPassed / 60));
        await db.sessions.add({
          id: 'sess-' + Date.now(),
          durationMinutes: mins,
          timestamp: new Date().toISOString()
        });

        alert(`آفرین! ${mins} دقیقه تمرکز عمیق همراه با ${activeCompanion.name} ثبت شد ✨`);
        if (onSessionSaved) onSessionSaved();
        handleReset();
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="space-y-6 max-w-3xl mx-auto">
          {isSelecting ? (
            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-md space-y-4">
              <div className="border-b pb-3 flex justify-between items-center">
                <h3 className="font-bold text-slate-800 text-sm">✨ همراه مطالعه‌ات را انتخاب کن:</h3>
                <button onClick={() => setIsSelecting(false)} className="text-xs text-slate-400 hover:text-slate-600">بستن ✕</button>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                {COMPANIONS.map(b => (
                  <div
                    key={b.id}
                    onClick={() => {
                      setActiveCompanion(b);
                      localStorage.setItem('study_companion_id', b.id);
                      setIsSelecting(false);
                    }}
                    className={`cursor-pointer p-3.5 rounded-2xl border text-center transition-all ${
                      activeCompanion.id === b.id 
                        ? 'border-indigo-600 bg-indigo-50/80 shadow-md scale-105' 
                        : 'border-slate-100 bg-white hover:border-indigo-200'
                    }`}
                  >
                    <div className="text-3xl mb-1.5">{b.emoji}</div>
                    <div className="font-bold text-xs text-slate-800">{b.name}</div>
                    <div className="text-[10px] text-slate-400 mt-1">{b.title}</div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="cozy-night-room rounded-3xl h-[480px] sm:h-[540px] text-white shadow-2xl relative flex flex-col justify-between p-6 sm:p-8 border border-indigo-500/25">
              <IllustratedFrameCharacter companion={activeCompanion} />

              <div className="flex items-center justify-between relative z-10">
                <button
                  onClick={() => setIsSelecting(true)}
                  className="text-xs bg-black/50 backdrop-blur hover:bg-black/70 px-4 py-2 rounded-full border border-white/20 font-bold flex items-center gap-2 transition text-white shadow-lg"
                >
                  <span>{activeCompanion.emoji}</span>
                  <span>تغییر همراه ({activeCompanion.name}) 🔄</span>
                </button>
                <span className="text-xs bg-black/50 backdrop-blur px-3 py-1 rounded-full border border-white/10 text-indigo-200">
                  {activeCompanion.desc}
                </span>
              </div>

              <div className="relative z-10 space-y-4 text-center bg-black/40 backdrop-blur-md p-5 rounded-3xl border border-white/15 shadow-2xl">
                {!isRunning && (
                  <div className="flex items-center justify-center gap-2">
                    {[15, 25, 45, 60].map(m => (
                      <button
                        key={m}
                        onClick={() => handleSetDuration(m)}
                        className={`text-xs px-3.5 py-1.5 rounded-xl font-bold transition ${
                          selectedMinutes === m ? 'bg-indigo-500 text-white shadow-md' : 'bg-white/10 text-slate-200 hover:bg-white/20'
                        }`}
                      >
                        {m} دقیقه
                      </button>
                    ))}
                  </div>
                )}

                <div>
                  <div className="text-5xl sm:text-6xl font-black font-mono tracking-widest text-white drop-shadow-lg">
                    {formatTime(timeLeft)}
                  </div>
                  <div className="text-[11px] text-indigo-200 mt-1">روی تصویر کلیک یا لمس کن تا همراهت واکنش نشان دهد 👆</div>
                </div>

                <div className="flex items-center justify-center gap-3">
                  <button
                    onClick={() => setIsRunning(!isRunning)}
                    className={`px-8 py-3 rounded-2xl text-xs font-bold text-white shadow-xl transition-all ${
                      isRunning ? 'bg-amber-500 hover:bg-amber-600 shadow-amber-500/30' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-600/40'
                    }`}
                  >
                    {isRunning ? 'مکث مطالعه ⏸' : `شروع تمرکز با ${activeCompanion.name} ▶`}
                  </button>

                  {sessionSecondsPassed > 10 && (
                    <button
                      onClick={handleComplete}
                      className="px-4 py-3 bg-emerald-500/40 text-emerald-200 border border-emerald-400/40 rounded-2xl text-xs font-bold hover:bg-emerald-500/50 transition"
                    >
                      ثبت جلسه 💾
                    </button>
                  )}

                  <button
                    onClick={handleReset}
                    className="p-3 bg-white/15 hover:bg-white/25 text-white rounded-2xl border border-white/20 text-xs"
                  >
                    🔄
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
            <div className="flex items-center justify-between text-xs">
              <span className="font-bold text-slate-700 flex items-center gap-1.5">
                <span>🎧</span> صداهای آرامش‌بخش محیط:
              </span>
              <span className="text-slate-400">ولوم: {Math.round(volume * 100)}%</span>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {Object.entries(SOUNDS).map(([key, item]) => (
                <button
                  key={key}
                  onClick={() => setActiveSound(key === activeSound ? null : key)}
                  className={`p-3 rounded-2xl border text-center transition-all ${
                    activeSound === key 
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                      : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  <div className="text-xl mb-1">{item.icon}</div>
                  <div className="text-[11px] font-bold">{item.title}</div>
                </button>
              ))}
            </div>

            <input 
              type="range" 
              min="0" 
              max="1" 
              step="0.05"
              value={volume} 
              onChange={e => setVolume(parseFloat(e.target.value))}
              className="w-full accent-indigo-600 cursor-pointer pt-1"
            />
          </div>

          <audio ref={audioRef} loop />
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [checkingAuth, setCheckingAuth] = useState(true);
      const [authMode, setAuthMode] = useState('login');

      const [fullName, setFullName] = useState('');
      const [age, setAge] = useState('');
      const [field, setField] = useState('');
      const [interests, setInterests] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      const [currentTab, setCurrentTab] = useState('dashboard');
      const [availableTimeMinutes, setAvailableTime] = useState(120);
      const [paths, setPaths] = useState([]);
      const [resources, setResources] = useState([]);
      const [topics, setTopics] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [goals, setGoals] = useState([]);
      const [profileData, setProfileData] = useState({ fullName: '', avatar: '', age: '', field: '', interests: '' });
      const [refreshKey, setRefreshKey] = useState(0);

      const [activeCompanion, setActiveCompanion] = useState(COMPANIONS[0]);

      useEffect(() => {
        const savedId = localStorage.getItem('study_companion_id');
        if (savedId) {
          const found = COMPANIONS.find(c => c.id === savedId);
          if (found) setActiveCompanion(found);
        }
      }, []);

      const displayName = useMemo(() => {
        return profileData.fullName || currentUser?.user_metadata?.full_name || 'کاربر عزیز';
      }, [profileData, currentUser]);

      const displayAvatar = useMemo(() => {
        return profileData.avatar || currentUser?.user_metadata?.avatar || 'icon.jpg';
      }, [profileData, currentUser]);

      const DAILY_QUOTES = useMemo(() => [
        `هر قدم کوچیکی که امروز برمی‌داری، پلی به سمت اهداف بزرگته ${displayName} جان 🌱`,
        "پیوستگی و ریتم آرام، یادگیری عمیق‌تری نسبت به ساعت‌های طولانی و پراکنده می‌سازه ✨",
        `به خودت افتخار کن که هر روز برای رشد مهارت‌هات وقت می‌ذاری ${displayName} عزیز 🌸`,
        "امروز با کیفیت و آرامش جلو برو؛ نتیجه‌ها در پس همین پیوستگی ظاهر می‌شن 🤍",
        "تعادل بین زندگی، استراحت و یادگیری، رمز ماندگاری این مسیره 🌿"
      ], [displayName]);

      useEffect(() => {
        if (!supabaseClient) {
          setCheckingAuth(false);
          return;
        }

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (session && session.user) {
            setCurrentUser(session.user);
            const meta = session.user.user_metadata || {};
            setProfileData({
              fullName: meta.full_name || '',
              avatar: meta.avatar || 'icon.jpg',
              age: meta.age || '',
              field: meta.field || '',
              interests: meta.interests || ''
            });
            syncPull(session.user.id).then(() => loadLocalData());
          }
          setCheckingAuth(false);
        });

        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          if (session && session.user) {
            setCurrentUser(session.user);
          } else {
            setCurrentUser(null);
          }
        });

        return () => subscription?.unsubscribe();
      }, []);

      const loadLocalData = async () => {
        const [p, r, tp, t, s, fc, g, prof] = await Promise.all([
          db.paths.toArray(),
          db.resources.toArray(),
          db.topics.toArray(),
          db.tasks.toArray(),
          db.sessions.toArray(),
          db.flashcards.toArray(),
          db.goals.toArray(),
          db.profile.get('user_profile')
        ]);
        setPaths(p);
        setResources(r);
        setTopics(tp);
        setTasks(t);
        setSessions(s);
        setFlashcards(fc);
        setGoals(g);
        if (prof) setProfileData(prof);
      };

      useEffect(() => {
        if (currentUser) loadLocalData();
      }, [refreshKey, currentUser]);

      const triggerRefresh = () => setRefreshKey(k => k + 1);

      const syncPush = async () => {
        if (!supabaseClient || !currentUser) return;
        const currentProf = await db.profile.get('user_profile') || profileData;
        const backup = {
          paths: await db.paths.toArray(),
          tasks: await db.tasks.toArray(),
          topics: await db.topics.toArray(),
          resources: await db.resources.toArray(),
          flashcards: await db.flashcards.toArray(),
          sessions: await db.sessions.toArray(),
          goals: await db.goals.toArray(),
          profile: currentProf
        };
        await supabaseClient.from('user_data').upsert({
          id: currentUser.id,
          data: backup,
          updated_at: new Date().toISOString()
        });
      };

      const syncPull = async (userId) => {
        const uid = userId || currentUser?.id;
        if (!supabaseClient || !uid) return;
        const { data, error } = await supabaseClient.from('user_data').select('data').eq('id', uid).single();
        if (error || !data || !data.data) return;
        const c = data.data;
        if (c.paths) await db.paths.bulkPut(c.paths);
        if (c.tasks) await db.tasks.bulkPut(c.tasks);
        if (c.topics) await db.topics.bulkPut(c.topics);
        if (c.resources) await db.resources.bulkPut(c.resources);
        if (c.flashcards) await db.flashcards.bulkPut(c.flashcards);
        if (c.sessions) await db.sessions.bulkPut(c.sessions);
        if (c.goals) await db.goals.bulkPut(c.goals);
        if (c.profile) {
          await db.profile.put({ id: 'user_profile', ...c.profile });
          setProfileData(c.profile);
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);

        if (password.length < 6) {
          setAuthError('رمز عبور باید حداقل ۶ کاراکتر باشد.');
          setAuthLoading(false);
          return;
        }

        try {
          if (authMode === 'register') {
            const enteredName = fullName.trim() || 'کاربر عزیز';
            const metaPayload = {
              full_name: enteredName,
              avatar: 'icon.jpg',
              age: age.trim(),
              field: field.trim(),
              interests: interests.trim()
            };

            const { data, error } = await supabaseClient.auth.signUp({
              email: email.trim(),
              password: password,
              options: { data: metaPayload }
            });

            if (error) throw error;
            if (data?.user) {
              setCurrentUser(data.user);
              await db.profile.put({ id: 'user_profile', ...metaPayload });
              setProfileData(metaPayload);
              await syncPull(data.user.id);
              loadLocalData();
            }
          } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: email.trim(),
              password: password
            });
            if (error) throw error;
            setCurrentUser(data.user);
            await syncPull(data.user.id);
            loadLocalData();
          }
        } catch (err) {
          console.error(err);
          setAuthError(err.message || 'خطا در ارتباط');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabaseClient.auth.signOut();
        setCurrentUser(null);
        await db.delete();
        await db.open();
        setPaths([]);
        setTasks([]);
        setTopics([]);
        setGoals([]);
        setSessions([]);
        setFlashcards([]);
        setProfileData({ fullName: '', avatar: 'icon.jpg', age: '', field: '', interests: '' });
      };

      const handleUpdateProfile = async (updatedData) => {
        setProfileData(updatedData);
        await db.profile.put({ id: 'user_profile', ...updatedData });
        
        if (supabaseClient && currentUser) {
          await supabaseClient.auth.updateUser({
            data: {
              full_name: updatedData.fullName,
              avatar: updatedData.avatar,
              age: updatedData.age,
              field: updatedData.field,
              interests: updatedData.interests
            }
          });
        }
        await syncPush();
        alert('پروفایل با موفقیت در فضای ابری ذخیره شد ✨');
        triggerRefresh();
      };

      if (checkingAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#FAF9FD]">
            <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-[#FAF9FD] to-purple-50 p-4 py-8">
            <div className="bg-white border border-slate-200/80 shadow-2xl rounded-3xl p-6 sm:p-8 w-full max-w-md space-y-6">
              <div className="text-center space-y-2">
                <img src="icon.jpg" alt="Logo" className="w-16 h-16 rounded-2xl mx-auto shadow-md object-cover" />
                <h1 className="font-black text-slate-800 text-lg">Learning OS</h1>
                <p className="text-xs text-slate-400">
                  {authMode === 'register' ? 'مشخصات خود را وارد کنید تا مشاور شما را بشناسد' : 'ورود به حساب کاربری شخصی'}
                </p>
              </div>

              {authError && (
                <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-2xl">
                  {authError}
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-3 text-xs">
                {authMode === 'register' && (
                  <>
                    <div className="grid grid-cols-3 gap-2">
                      <div className="col-span-2">
                        <label className="block text-slate-600 font-bold mb-1">نام و نام خانوادگی</label>
                        <input
                          type="text"
                          required
                          placeholder="مثلاً: محبوبه..."
                          value={fullName}
                          onChange={e => setFullName(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-600 font-bold mb-1">سن</label>
                        <input
                          type="number"
                          placeholder="مثلاً: ۲۵"
                          value={age}
                          onChange={e => setAge(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs text-center"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-600 font-bold mb-1">رشته تحصیلی یا حوزه اصلی فعالیت</label>
                      <input
                        type="text"
                        placeholder="مثلاً: روانشناسی، آموزش، طراحی..."
                        value={field}
                        onChange={e => setField(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-600 font-bold mb-1">مهارت‌ها و علاقه‌مندی‌های هدف</label>
                      <textarea
                        rows="2"
                        placeholder="مثلاً: رفرنس‌های بالینی، طراحی Canva، زبان..."
                        value={interests}
                        onChange={e => setInterests(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-xs leading-relaxed"
                      />
                    </div>
                  </>
                )}

                <div>
                  <label className="block text-slate-600 font-bold mb-1">پست الکترونیک (ایمیل)</label>
                  <input
                    type="email"
                    required
                    placeholder="name@example.com"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-left font-mono text-xs"
                    dir="ltr"
                  />
                </div>

                <div>
                  <label className="block text-slate-600 font-bold mb-1">رمز عبور (حداقل ۶ کاراکتر)</label>
                  <input
                    type="password"
                    required
                    placeholder="••••••••"
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-left font-mono text-xs"
                    dir="ltr"
                  />
                </div>

                <button
                  type="submit"
                  disabled={authLoading}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-200 transition disabled:opacity-50 text-xs mt-2"
                >
                  {authLoading ? 'در حال برقراری ارتباط...' : (authMode === 'login' ? 'ورود به سیستم‌عامل' : 'تکمیل ثبت‌نام و شناخت مشاور ✨')}
                </button>

                <div className="text-center pt-2">
                  <button
                    type="button"
                    onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }}
                    className="text-xs text-indigo-600 font-bold hover:underline"
                  >
                    {authMode === 'login' ? 'حساب کاربری ندارید؟ ثبت‌نام و تکمیل شناخت' : 'قبلاً عضو شده‌اید؟ ورود'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex bg-[#FAF9FD] relative">
          <FloatingLivingPetsWidget activeCompanion={activeCompanion} setActiveCompanion={setActiveCompanion} />

          <aside className="hidden md:flex flex-col w-64 bg-white border-l border-slate-200/80 p-6 justify-between fixed top-0 bottom-0 right-0 z-20">
            <div className="space-y-6">
              <div className="flex items-center gap-3">
                <img src={displayAvatar} alt={displayName} className="w-11 h-11 rounded-2xl object-cover border border-indigo-100 shadow-sm" />
                <div className="min-w-0">
                  <h2 className="font-bold text-slate-800 text-sm truncate">{displayName}</h2>
                  <span className="text-[11px] text-slate-400 truncate block">
                    {profileData.field ? profileData.field : 'سیستم‌عامل یادگیری'}
                  </span>
                </div>
              </div>

              <nav className="space-y-1 text-xs">
                {[
                  { id: 'dashboard', label: 'داشبورد اصلی', icon: '🏠' },
                  { id: 'focus', label: 'اتاق تمرکز و همراه', icon: '⏱️' },
                  { id: 'paths', label: 'مسیرهای یادگیری', icon: '📚' },
                  { id: 'clipper', label: 'استخراج وب و لینک‌ها', icon: '🌐' },
                  { id: 'tasks', label: 'برنامه روزانه (WHAT)', icon: '📋' },
                  { id: 'leitner', label: 'جعبه لایتنر هوشمند', icon: '🗂️' },
                  { id: 'recovery', label: 'اتاق ریکاوری و عقب‌افتاده', icon: '🛋️' },
                  { id: 'assistant', label: 'مشاور و دستیار هوشمند', icon: '🌸' },
                  { id: 'reports', label: 'پیشرفت و اهداف ماهانه', icon: '📊' },
                  { id: 'profile', label: 'پروفایل و علایق شناختی', icon: '⚙️' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setCurrentTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl font-bold transition ${
                      currentTab === item.id ? 'bg-indigo-50 text-indigo-700 shadow-sm' : 'text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="space-y-2 border-t pt-4">
              <div className="text-[11px] text-slate-400 font-mono truncate">{currentUser.email}</div>
              <button
                onClick={handleLogout}
                className="w-full text-center text-xs text-rose-600 bg-rose-50 border border-rose-200 py-2 rounded-xl font-bold hover:bg-rose-100 transition mt-2"
              >
                خروج از حساب
              </button>
            </div>
          </aside>

          <main className="flex-1 md:mr-64 flex flex-col min-w-0 z-10">
            <header className="bg-white/90 backdrop-blur border-b border-slate-200/80 px-4 md:px-8 py-3 flex items-center justify-between sticky top-0 z-10">
              <div className="text-xs font-bold text-slate-700 flex items-center gap-2.5">
                <img src={displayAvatar} alt={displayName} className="w-7 h-7 rounded-full object-cover border" />
                <span>{displayName} {profileData.field && <span className="text-slate-400 font-normal">({profileData.field})</span>}</span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={async () => { await syncPush(); alert('اطلاعات با سرور ابری همگام شد ✅'); }}
                  className="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-xl border border-indigo-200 hover:bg-indigo-100"
                >
                  ☁️ ذخیره ابری
                </button>
                <button
                  onClick={() => setCurrentTab('profile')}
                  className="text-xs text-slate-600 bg-slate-100 px-3 py-1.5 rounded-xl font-bold hover:bg-slate-200"
                >
                  ⚙️ پروفایل
                </button>
              </div>
            </header>

            <div className="p-4 md:p-8 max-w-4xl mx-auto w-full space-y-6 pb-24 md:pb-12">
              {currentTab === 'dashboard' && (
                <DashboardView
                  displayName={displayName}
                  displayAvatar={displayAvatar}
                  quotes={DAILY_QUOTES}
                  paths={paths}
                  tasks={tasks}
                  topics={topics}
                  goals={goals}
                  availableTimeMinutes={availableTimeMinutes}
                  setAvailableTime={setAvailableTime}
                  onGoToFocus={() => setCurrentTab('focus')}
                  triggerRefresh={() => { triggerRefresh(); syncPush(); }}
                />
              )}

              {currentTab === 'focus' && (
                <FocusRoomView
                  activeCompanion={activeCompanion}
                  setActiveCompanion={setActiveCompanion}
                  onSessionSaved={() => { triggerRefresh(); syncPush(); }}
                />
              )}

              {currentTab === 'paths' && (
                <PathsUniversalView paths={paths} topics={topics} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'clipper' && (
                <WebClipperView paths={paths} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'tasks' && (
                <TasksView paths={paths} tasks={tasks} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'leitner' && (
                <LeitnerView topics={topics} flashcards={flashcards} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'recovery' && (
                <RecoveryLoungeView displayName={displayName} tasks={tasks} topics={topics} triggerRefresh={() => { triggerRefresh(); syncPush(); }} />
              )}

              {currentTab === 'assistant' && (
                <CounselorAssistantView
                  displayName={displayName}
                  profileData={profileData}
                  paths={paths}
                  topics={topics}
                  goals={goals}
                  triggerRefresh={() => { triggerRefresh(); syncPush(); }}
                />
              )}

              {currentTab === 'reports' && (
                <ReportsView displayName={displayName} sessions={sessions} goals={goals} topics={topics} />
              )}

              {currentTab === 'profile' && (
                <ProfileSettingsView
                  initialData={profileData}
                  onSave={handleUpdateProfile}
                />
              )}
            </div>
          </main>

          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-slate-200 flex items-center justify-around px-1 z-30">
            {[
              { id: 'dashboard', label: 'خانه', icon: '🏠' },
              { id: 'focus', label: 'تمرکز', icon: '⏱️' },
              { id: 'tasks', label: 'برنامه', icon: '📋' },
              { id: 'assistant', label: 'مشاور', icon: '🌸' },
              { id: 'profile', label: 'پروفایل', icon: '⚙️' }
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setCurrentTab(item.id)}
                className={`flex flex-col items-center gap-1 text-[10px] font-bold ${
                  currentTab === item.id ? 'text-indigo-600' : 'text-slate-400'
                }`}
              >
                <span className="text-sm">{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    function ProfileSettingsView({ initialData, onSave }) {
      const [fullName, setFullName] = useState(initialData.fullName || '');
      const [avatar, setAvatar] = useState(initialData.avatar || 'icon.jpg');
      const [age, setAge] = useState(initialData.age || '');
      const [field, setField] = useState(initialData.field || '');
      const [interests, setInterests] = useState(initialData.interests || '');

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          alert('حجم عکس حداکثر ۲ مگابایت باشد.');
          return;
        }

        const reader = new FileReader();
        reader.onloadend = () => setAvatar(reader.result);
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ fullName, avatar, age, field, interests });
      };

      return (
        <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-sm max-w-xl mx-auto space-y-6">
          <div className="border-b pb-4">
            <h2 className="font-bold text-slate-800 text-base">پروفایل شناختی و تنظیمات نمایه</h2>
            <p className="text-xs text-slate-400 mt-1">مشاور هوشمند با بررسی این فیلدها، برنامه‌ها را متناسب با شما تنظیم می‌کند.</p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-4 text-xs">
            <div className="flex flex-col sm:flex-row items-center gap-5 pb-3 border-b">
              <img src={avatar} alt="Profile" className="w-20 h-20 rounded-3xl object-cover border-2 border-indigo-500 shadow-md" />
              <div className="space-y-1.5 text-center sm:text-right">
                <label className="block text-slate-700 font-bold">آپلود عکس جدید از دستگاه:</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handleImageUpload}
                  className="block w-full text-xs text-slate-500 file:mr-0 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"
                />
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2">
              <div className="col-span-2">
                <label className="block text-slate-700 font-bold mb-1">نام و نام خانوادگی:</label>
                <input
                  type="text"
                  required
                  value={fullName}
                  onChange={e => setFullName(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 font-bold text-slate-800"
                />
              </div>
              <div>
                <label className="block text-slate-700 font-bold mb-1">سن:</label>
                <input
                  type="number"
                  value={age}
                  onChange={e => setAge(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 text-center"
                />
              </div>
            </div>

            <div>
              <label className="block text-slate-700 font-bold mb-1">رشته تحصیلی یا حوزه اصلی:</label>
              <input
                type="text"
                value={field}
                onChange={e => setField(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600"
              />
            </div>

            <div>
              <label className="block text-slate-700 font-bold mb-1">مهارت‌ها و علاقه‌مندی‌های هدف:</label>
              <textarea
                rows="3"
                value={interests}
                onChange={e => setInterests(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:border-indigo-600 leading-relaxed"
              />
            </div>

            <button
              type="submit"
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-md shadow-indigo-100 transition text-xs mt-2"
            >
              ذخیره تغییرات نمایه و به‌روزرسانی مشاور ✓
            </button>
          </form>
        </div>
      );
    }

    function CounselorAssistantView({ displayName, profileData, paths, topics, goals, triggerRefresh }) {
      const [input, setInput] = useState('');
      
      const initialGreeting = useMemo(() => {
        let text = `سلام ${displayName} جانم! 🌸 من اینجام؛ مثل یک دوست و مشاور یادگیری همگام با تو.`;
        if (profileData.field) {
          text += ` با توجه به تمرکزت در حوزه «${profileData.field}»`;
        }
        if (profileData.interests) {
          text += ` و علایق هدف [${profileData.interests}]، برنامه‌ت رو سبک، دقیق و پیوسته می‌چینیم.`;
        } else {
          text += ` هر هدفی برای این ماه داری بنویس تا با هم خردش کنیم.`;
        }
        return text;
      }, [displayName, profileData]);

      const [messages, setMessages] = useState([
        { id: '1', sender: 'counselor', text: initialGreeting }
      ]);

      const handleSend = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        const text = input.trim();
        setMessages(prev => [...prev, { id: 'u-' + Date.now(), sender: 'user', text }]);
        setInput('');

        setTimeout(() => {
          let reply = '';
          if (text.includes('مهمون') || text.includes('خسته') || text.includes('وقت ندارم')) {
            reply = `${displayName} عزیزم، آرامش و زندگی اولویت اوله 🌸 برنامه رو بردم روی حالت «حفظ پیوستگی کم‌فشار». فقط ۱۰ دقیقه مطالعه هم کافیه تا ریتم حفظ بشه.`;
          } else if (text.includes('هدف') || text.includes('می‌خوام')) {
            reply = `هدف فوق‌العاده‌ایه ${displayName} جان! 🎯 بر اساس زمینه تخصصی‌ت، اون رو خرد کردم و آماده تیک زدن در داشبورد گذاشتم.`;
          } else {
            reply = `پیامت دریافت شد ${displayName} جان 🌸 همراهتم تا با ریتم پایدار و بدون فرسودگی مهارت‌هات رو ارتقا بدی.`;
          }
          setMessages(prev => [...prev, { id: 'c-' + Date.now(), sender: 'counselor', text: reply }]);
        }, 400);
      };

      return (
        <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm flex flex-col h-[520px]">
          <div className="p-4 border-b flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-xl">🌸</span>
              <div>
                <h3 className="font-bold text-slate-800 text-xs">مشاور و همراه هوشمند</h3>
                <span className="text-[10px] text-emerald-600 font-bold">● متصل به علایق {displayName}</span>
              </div>
            </div>
            {profileData.field && (
              <span className="text-[11px] text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-0.5 rounded-full font-bold">
                حوزه: {profileData.field}
              </span>
            )}
          </div>

          <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
            {messages.map(m => (
              <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] p-3.5 rounded-2xl whitespace-pre-wrap leading-relaxed ${m.sender === 'user' ? 'bg-indigo-600 text-white' : 'bg-[#FAF8FE] text-slate-800 border'}`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          <form onSubmit={handleSend} className="p-3 border-t flex gap-2">
            <input
              type="text"
              placeholder="پیام یا هدف جدیدت رو اینجا بنویس..."
              value={input}
              onChange={e => setInput(e.target.value)}
              className="flex-1 bg-slate-50 border rounded-2xl px-4 py-2.5 text-xs focus:outline-none"
            />
            <button type="submit" className="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-2xl text-xs hover:bg-indigo-700">ارسال</button>
          </form>
        </div>
      );
    }

    function DashboardView({ displayName, displayAvatar, quotes, paths, tasks, topics, goals, availableTimeMinutes, setAvailableTime, onGoToFocus, triggerRefresh }) {
      const todayDate = useMemo(() => getJalaliDate(), []);
      const quote = useMemo(() => quotes[new Date().getDate() % quotes.length], [quotes]);

      const topTask = useMemo(() => {
        const pending = tasks.filter(t => t.status !== 'done');
        return pending.find(t => t.isVital || t.priority === 'critical') || pending[0];
      }, [tasks]);

      const toggleTask = async (task) => {
        const next = task.status === 'done' ? 'not_started' : 'done';
        await db.tasks.update(task.id, { status: next });
        triggerRefresh();
      };

      const filteredTasks = useMemo(() => {
        let acc = 0;
        return tasks.filter(t => {
          if (t.status === 'done') return true;
          if (acc + (t.estimatedMinutes || 30) <= availableTimeMinutes) {
            acc += (t.estimatedMinutes || 30);
            return true;
          }
          return false;
        });
      }, [tasks, availableTimeMinutes]);

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-l from-indigo-50 via-purple-50 to-pink-50 border border-purple-100 rounded-3xl p-6 shadow-sm flex items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 text-indigo-700 text-xs font-bold mb-1">
                <span>📅</span>
                <span>{todayDate}</span>
              </div>
              <h1 className="text-xl md:text-2xl font-black text-slate-800">
                سلام {displayName} جان! روزت سرشار از آرامش 🌸
              </h1>
              <p className="text-xs md:text-sm text-slate-600 mt-2">«{quote}»</p>
            </div>
            <img src={displayAvatar} alt={displayName} className="w-16 h-16 md:w-20 md:h-20 rounded-3xl object-cover border-2 border-white shadow-md hidden sm:block" />
          </div>

          <div className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-5 rounded-3xl shadow-lg shadow-indigo-100 flex items-center justify-between">
            <div className="space-y-1">
              <h3 className="font-black text-sm flex items-center gap-2">
                <span>⏱️</span> ورود به اتاق تمرکز و همراه مطالعه
              </h3>
              <p className="text-xs text-indigo-100">کاراکترت پشت میزه تا با ریتم آرام همراهت باشه.</p>
            </div>
            <button 
              onClick={onGoToFocus}
              className="bg-white text-indigo-600 font-black text-xs px-4 py-2.5 rounded-xl shadow hover:bg-indigo-50 transition"
            >
              شروع جلسه تمرکز ←
            </button>
          </div>

          {topTask && (
            <div className="bg-white border-2 border-indigo-100 rounded-3xl p-5 shadow-sm relative overflow-hidden">
              <div className="absolute top-0 right-0 w-2 h-full bg-indigo-600"></div>
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <span className="text-indigo-700 text-[11px] font-bold bg-indigo-50 px-2.5 py-1 rounded-full">
                    🧠 پیشنهاد مشاور: الان بهترین کار برای تو:
                  </span>
                  <h3 className="font-bold text-slate-800 text-sm mt-2">{topTask.title}</h3>
                  <span className="text-xs text-slate-400 mt-0.5 block">⏱ تخمین: {topTask.estimatedMinutes || 30} دقیقه</span>
                </div>
                <button
                  onClick={() => toggleTask(topTask)}
                  className="bg-indigo-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-indigo-700 transition"
                >
                  انجام شد ✓
                </button>
              </div>
            </div>
          )}

          <div className="bg-white border border-slate-200/80 rounded-3xl p-6 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div>
                <h3 className="font-bold text-slate-800 text-sm">امروز چقدر زمان در اختیار داری؟</h3>
                <p className="text-xs text-slate-400">سیستم حجم مناسب را بر اساس فرصت شما می‌چیند.</p>
              </div>
              <div className="flex items-center gap-1.5 bg-slate-50 p-1.5 rounded-2xl border border-slate-200">
                {[30, 60, 90, 120, 180].map(m => (
                  <button
                    key={m}
                    onClick={() => setAvailableTime(m)}
                    className={`px-3 py-1 rounded-xl text-xs font-bold transition ${
                      availableTimeMinutes === m ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'
                    }`}
                  >
                    {m} دقیقه
                  </button>
                ))}
              </div>
            </div>

            <div className="space-y-2">
              {filteredTasks.length === 0 ? (
                <div className="text-center py-6 text-xs text-slate-400">تسک فعالی برای امروز تعریف نشده است.</div>
              ) : (
                filteredTasks.map(t => (
                  <div key={t.id} className="flex items-center justify-between p-3.5 bg-slate-50/70 rounded-2xl border border-slate-100 text-xs">
                    <div className="flex items-center gap-3">
                      <input
                        type="checkbox"
                        checked={t.status === 'done'}
                        onChange={() => toggleTask(t)}
                        className="w-4 h-4 accent-indigo-600 rounded"
                      />
                      <span className={`font-bold ${t.status === 'done' ? 'line-through text-slate-400' : 'text-slate-700'}`}>
                        {t.title}
                      </span>
                    </div>
                    <span className="text-slate-400">⏱ {t.estimatedMinutes || 30} دقیقه</span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    function PathTopicsSection({ path, topics, triggerRefresh }) {
      const [showAddTopic, setShowAddTopic] = useState(false);
      const [topicTitle, setTopicTitle] = useState('');

      const pathTopics = topics.filter(t => t.pathId === path.id);

      const handleAddTopic = async (e) => {
        e.preventDefault();
        if (!topicTitle.trim()) return;
        await db.topics.add({
          id: 'topic-' + Date.now(),
          pathId: path.id,
          title: topicTitle.trim(),
          mastery: 0,
          isWeak: false,
          resourceId: null,
          prereqTopicId: null
        });
        setTopicTitle('');
        setShowAddTopic(false);
        triggerRefresh();
      };

      const handleDeleteTopic = async (topicId) => {
        await db.topics.delete(topicId);
        triggerRefresh();
      };

      return (
        <div className="pt-3 mt-3 border-t border-slate-100 space-y-2">
          <div className="flex items-center justify-between">
            <span className="text-[11px] font-bold text-slate-500">مباحث این مسیر</span>
            <button
              onClick={() => setShowAddTopic(s => !s)}
              className="text-[11px] font-bold text-indigo-600 hover:underline"
            >
              {showAddTopic ? 'بستن' : '+ افزودن مبحث'}
            </button>
          </div>

          {showAddTopic && (
            <form onSubmit={handleAddTopic} className="flex items-center gap-2">
              <input
                type="text"
                autoFocus
                placeholder="عنوان مبحث..."
                value={topicTitle}
                onChange={e => setTopicTitle(e.target.value)}
                className="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs focus:outline-none focus:border-indigo-600"
              />
              <button type="submit" className="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-xl hover:bg-indigo-700 transition">
                ثبت
              </button>
            </form>
          )}

          {pathTopics.length === 0 ? (
            <div className="text-[11px] text-slate-400 py-2">
              هنوز مبحثی برای این مسیر اضافه نشده
            </div>
          ) : (
            <div className="space-y-1.5">
              {pathTopics.map(t => (
                <div key={t.id} className="flex items-center justify-between bg-slate-50/70 border border-slate-100 rounded-xl px-3 py-2 text-xs">
                  <span className="font-bold text-slate-700">{t.title}</span>
                  <button
                    onClick={() => handleDeleteTopic(t.id)}
                    className="text-rose-500 text-[11px] font-bold hover:underline"
                  >
                    حذف
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function PathsUniversalView({ paths, topics, triggerRefresh }) {
      const [showModal, setShowModal] = useState(false);
      const [title, setTitle] = useState('');
      const [icon, setIcon] = useState('🧠');
      const [goal, setGoal] = useState('');

      const handleAdd = async (e) => {
        e.preventDefault();
        if (!title) return;
        await db.paths.add({ id: 'path-' + Date.now(), title, icon, goal, priority: 'high' });
        setTitle('');
        setShowModal(false);
        triggerRefresh();
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <h2 className="font-bold text-slate-800 text-base">مسیرهای یادگیری</h2>
            <button onClick={() => setShowModal(true)} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-indigo-700 transition">+ مسیر جدید</button>
          </div>
          {showModal && (
            <form onSubmit={handleAdd} className="bg-white p-5 rounded-3xl border space-y-3 text-xs">
              <div className="grid grid-cols-2 gap-2">
                <input type="text" placeholder="عنوان مهارت..." value={title} onChange={e => setTitle(e.target.value)} className="bg-slate-50 border p-2.5 rounded-xl" required />
                <input type="text" placeholder="آیکون (ایموجی)..." value={icon} onChange={e => setIcon(e.target.value)} className="bg-slate-50 border p-2.5 rounded-xl" />
              </div>
              <input type="text" placeholder="هدف کلی..." value={goal} onChange={e => setGoal(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl" />
              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={() => setShowModal(false)} className="text-slate-400 px-3">لغو</button>
                <button type="submit" className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl hover:bg-indigo-700">ذخیره</button>
              </div>
            </form>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {paths.map(p => (
              <div key={p.id} className="bg-white p-5 rounded-3xl border shadow-sm space-y-2">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{p.icon}</span>
                  <h3 className="font-bold text-slate-800 text-sm">{p.title}</h3>
                </div>
                <p className="text-xs text-slate-400">{p.goal}</p>
                <PathTopicsSection path={p} topics={topics} triggerRefresh={triggerRefresh} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WebClipperView({ paths, triggerRefresh }) {
      const [url, setUrl] = useState('');
      const [pathId, setPathId] = useState(paths[0]?.id || '');
      const [title, setTitle] = useState('');
      const [extractedContent, setExtractedContent] = useState('');
      const [isExtracting, setIsExtracting] = useState(false);

      const handleClipper = (e) => {
        e.preventDefault();
        if (!url) return;
        setIsExtracting(true);
        setTimeout(() => {
          const sampleText = `این نسخه استخراج‌شده از لینک (${url}) است.\nمفاهیم کلیدی، تعاریف و نکات بدون تبلیغات ثبت شدند.`;
          setExtractedContent(sampleText);
          setIsExtracting(false);
        }, 600);
      };

      const handleSaveResource = async () => {
        if (!pathId || !extractedContent) return;
        await db.resources.add({
          id: 'res-' + Date.now(),
          pathId,
          title: title || 'مقاله آنلاین',
          type: 'web_article',
          content: extractedContent,
          url
        });
        alert('منبع در رفرنس‌های شما ذخیره شد ✨');
        setUrl('');
        setTitle('');
        setExtractedContent('');
        triggerRefresh();
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
            <h3 className="font-bold text-slate-800 text-sm">استخراج مقالات و منابع وب</h3>
            <form onSubmit={handleClipper} className="space-y-3 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input
                  type="url"
                  placeholder="آدرس اینترنتی (URL)..."
                  value={url}
                  onChange={e => setUrl(e.target.value)}
                  className="bg-slate-50 border p-2.5 rounded-xl focus:outline-none"
                  required
                />
                <input
                  type="text"
                  placeholder="عنوان منبع..."
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  className="bg-slate-50 border p-2.5 rounded-xl focus:outline-none"
                />
              </div>
              <div className="flex items-center justify-between gap-3">
                <select
                  value={pathId}
                  onChange={e => setPathId(e.target.value)}
                  className="bg-slate-50 border p-2.5 rounded-xl text-xs flex-1"
                >
                  <option value="">انتخاب مسیر یادگیری...</option>
                  {paths.map(p => (
                    <option key={p.id} value={p.id}>{p.icon} {p.title}</option>
                  ))}
                </select>
                <button
                  type="submit"
                  disabled={isExtracting}
                  className="bg-indigo-600 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition"
                >
                  {isExtracting ? 'در حال پردازش...' : 'استخراج محتوا ⚡'}
                </button>
              </div>
            </form>
          </div>

          {extractedContent && (
            <div className="bg-white p-6 rounded-3xl border border-emerald-200 space-y-4">
              <div className="p-4 bg-slate-50 rounded-2xl text-xs text-slate-700 whitespace-pre-wrap leading-relaxed border">
                {extractedContent}
              </div>
              <button
                onClick={handleSaveResource}
                className="bg-emerald-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl hover:bg-emerald-700 transition"
              >
                ذخیره در رفرنس‌های این مهارت ✓
              </button>
            </div>
          )}
        </div>
      );
    }

    function TasksView({ paths, tasks, triggerRefresh }) {
      const [title, setTitle] = useState('');
      const [pathId, setPathId] = useState(paths[0]?.id || '');
      const [estimatedMinutes, setEstimatedMinutes] = useState('30');

      const handleAdd = async (e) => {
        e.preventDefault();
        if (!title || !pathId) return;
        await db.tasks.add({ id: 'task-' + Date.now(), title, pathId, estimatedMinutes: parseInt(estimatedMinutes, 10) || 30, status: 'not_started' });
        setTitle('');
        triggerRefresh();
      };

      return (
        <div className="space-y-6">
          <form onSubmit={handleAdd} className="bg-white p-5 rounded-3xl border space-y-3 text-xs">
            <h3 className="font-bold text-slate-800 text-sm">افزودن تسک روزانه</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <input type="text" placeholder="عنوان کار..." value={title} onChange={e => setTitle(e.target.value)} className="bg-slate-50 border p-2.5 rounded-xl" required />
              <select value={pathId} onChange={e => setPathId(e.target.value)} className="bg-slate-50 border p-2.5 rounded-xl">
                {paths.map(p => (
                  <option key={p.id} value={p.id}>{p.icon} {p.title}</option>
                ))}
              </select>
            </div>
            <div className="flex items-center justify-between">
              <input type="number" placeholder="زمان (دقیقه)" value={estimatedMinutes} onChange={e => setEstimatedMinutes(e.target.value)} className="bg-slate-50 border p-2 rounded-xl w-32" />
              <button type="submit" className="bg-indigo-600 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-indigo-700 transition">ثبت تسک</button>
            </div>
          </form>
          <div className="space-y-2">
            {tasks.map(t => (
              <div key={t.id} className="flex items-center justify-between p-3.5 bg-white rounded-2xl border text-xs">
                <span className="font-bold text-slate-700">{t.title}</span>
                <button onClick={async () => { await db.tasks.delete(t.id); triggerRefresh(); }} className="text-rose-500 font-bold">حذف</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LeitnerView({ topics, flashcards, triggerRefresh }) {
      const [front, setFront] = useState('');
      const [back, setBack] = useState('');
      const [selectedTopicId, setSelectedTopicId] = useState(topics[0]?.id || '');
      const [revealedCardId, setRevealedCardId] = useState(null);

      const handleAddCard = async (e) => {
        e.preventDefault();
        if (!front || !back || !selectedTopicId) return;
        await db.flashcards.add({
          id: 'fc-' + Date.now(),
          topicId: selectedTopicId,
          front,
          back,
          step: 1,
          nextReviewDate: new Date().toISOString().split('T')[0]
        });
        setFront('');
        setBack('');
        triggerRefresh();
      };

      const handleRateCard = async (card, success) => {
        const nextStep = success ? card.step + 1 : 1;
        await db.flashcards.update(card.id, {
          step: nextStep,
          nextReviewDate: new Date(Date.now() + nextStep * 86400000 * 2).toISOString().split('T')[0]
        });
        setRevealedCardId(null);
        triggerRefresh();
      };

      return (
        <div className="space-y-6">
          <form onSubmit={handleAddCard} className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-sm space-y-3 text-xs">
            <h3 className="font-bold text-slate-800 text-sm">افزودن فلش‌کارت مرور فواصل‌دار</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <input
                type="text"
                placeholder="روی کارت (سوال / مفهوم کلیدی)..."
                value={front}
                onChange={e => setFront(e.target.value)}
                className="bg-slate-50 border p-2.5 rounded-xl"
                required
              />
              <input
                type="text"
                placeholder="پشت کارت (پاسخ / توضیح)..."
                value={back}
                onChange={e => setBack(e.target.value)}
                className="bg-slate-50 border p-2.5 rounded-xl"
                required
              />
            </div>
            <div className="flex items-center justify-between gap-3">
              <select
                value={selectedTopicId}
                onChange={e => setSelectedTopicId(e.target.value)}
                className="bg-slate-50 border p-2 rounded-xl flex-1 text-xs"
              >
                {topics.map(t => (
                  <option key={t.id} value={t.id}>{t.title}</option>
                ))}
              </select>
              <button type="submit" className="bg-indigo-600 text-white font-bold px-6 py-2 rounded-xl hover:bg-indigo-700 transition">
                ثبت کارت
              </button>
            </div>
          </form>

          <div className="space-y-3">
            <h4 className="font-bold text-slate-800 text-xs">کارت‌های آماده مرور ({flashcards.length})</h4>
            {flashcards.length === 0 ? (
              <div className="bg-white p-8 rounded-3xl border text-center text-xs text-slate-400">
                جعبه لایتنر فعلاً خالی است.
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {flashcards.map(fc => (
                  <div key={fc.id} className="bg-white p-5 rounded-3xl border shadow-sm space-y-3 text-xs">
                    <div className="font-bold text-slate-800">{fc.front}</div>
                    {revealedCardId === fc.id ? (
                      <div className="p-3 bg-indigo-50/60 rounded-xl text-indigo-900 border border-indigo-100">
                        {fc.back}
                      </div>
                    ) : (
                      <button onClick={() => setRevealedCardId(fc.id)} className="text-[11px] text-indigo-600 font-bold hover:underline block">
                        نمایش پاسخ کارت 👁️
                      </button>
                    )}
                    {revealedCardId === fc.id && (
                      <div className="flex justify-end gap-2 pt-2 border-t">
                        <button onClick={() => handleRateCard(fc, false)} className="bg-rose-50 text-rose-700 px-3 py-1.5 rounded-xl font-bold border border-rose-200">
                          نیاز به تکرار
                        </button>
                        <button onClick={() => handleRateCard(fc, true)} className="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-xl font-bold border border-emerald-200">
                          مسلط بودم ✓
                        </button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function RecoveryLoungeView({ displayName, tasks, topics, triggerRefresh }) {
      const weakTopics = topics.filter(t => t.isWeak || t.mastery < 65);
      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/80 rounded-3xl p-6 shadow-sm">
            <h3 className="font-bold text-amber-900 text-sm">اتاق ریکاوری و تثبیت مباحث 🌿</h3>
            <p className="text-xs text-amber-800 mt-1">
              {displayName} جان، اینجا مباحث چالش‌برانگیز ریشه‌یابی می‌شوند تا بدون استرس پایه‌ها را تقویت کنی.
            </p>
          </div>
          <div className="space-y-3">
            {weakTopics.length === 0 ? (
              <div className="bg-white p-8 rounded-3xl border text-center text-xs text-slate-400">تمام مباحث در سطح مطلوب هستند ✨</div>
            ) : (
              weakTopics.map(wt => (
                <div key={wt.id} className="bg-white p-4 rounded-2xl border border-amber-200 shadow-sm flex items-center justify-between text-xs">
                  <div className="font-bold text-slate-800">⚠️ {wt.title}</div>
                  <button onClick={async () => { await db.topics.update(wt.id, { isWeak: false, mastery: 80 }); triggerRefresh(); }} className="bg-emerald-50 text-emerald-700 font-bold px-3 py-1.5 rounded-xl border border-emerald-200">
                    تثبیت شد ✓
                  </button>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function ReportsView({ displayName, sessions, goals, topics }) {
      const totalMinutes = sessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);
      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
            <div className="bg-white p-5 rounded-3xl border shadow-sm">
              <span className="text-xs text-slate-400 font-bold">مجموع زمان مطالعه</span>
              <div className="text-2xl font-black text-indigo-600 mt-1">{totalMinutes} دقیقه</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border shadow-sm">
              <span className="text-xs text-slate-400 font-bold">جلسات مطالعه</span>
              <div className="text-2xl font-black text-slate-800 mt-1">{sessions.length} جلسه</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border shadow-sm">
              <span className="text-xs text-slate-400 font-bold">اهداف فعال</span>
              <div className="text-2xl font-black text-emerald-600 mt-1">{goals.length} هدف</div>
            </div>
          </div>
          
          <div className="bg-white p-6 rounded-3xl border shadow-sm space-y-3">
            <h4 className="font-bold text-slate-800 text-sm">وضعیت اهداف این ماه {displayName}</h4>
            {goals.length === 0 ? (
              <div className="text-center py-6 text-xs text-slate-400">هنوز هدفی ثبت نشده است.</div>
            ) : (
              goals.map(g => (
                <div key={g.id} className="p-3.5 bg-slate-50 rounded-2xl border space-y-1 text-xs">
                  <div className="flex items-center justify-between font-bold text-slate-800">
                    <span>🎯 {g.title}</span>
                    <span className="text-indigo-600">{g.progress}% پیشرفت</span>
                  </div>
                  <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                    <div className="bg-indigo-600 h-full rounded-full" style={{ width: `${g.progress}%` }}></div>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
