<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning OS</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/4.0.8/dexie.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#FAF9FE] text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const db = new Dexie('LearningOS_CloudDB');
    db.version(1).stores({
      paths: 'id, title',
      tasks: 'id, pathId, title, status',
      auth: 'id, email, secret'
    });

    function App() {
      const [email, setEmail] = useState('');
      const [secret, setSecret] = useState('');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [syncStatus, setSyncStatus] = useState('آماده');
      const [tasks, setTasks] = useState([]);
      const [paths, setPaths] = useState([]);
      const [taskTitle, setTaskTitle] = useState('');
      const [pathTitle, setPathTitle] = useState('');

      const loadLocalData = async () => {
        const [p, t, a] = await Promise.all([
          db.paths.toArray(),
          db.tasks.toArray(),
          db.auth.get('current_user')
        ]);
        setPaths(p);
        setTasks(t);
        if (a) {
          setEmail(a.email);
          setSecret(a.secret);
          setIsLoggedIn(true);
        }
      };

      useEffect(() => { loadLocalData(); }, []);

      const getCloudKey = () => btoa(email.trim().toLowerCase() + ':' + secret.trim());

      const syncWithCloud = async (forceDownload = false) => {
        if (!email || !secret) return;
        setSyncStatus('در حال همگام‌سازی...');
        const key = getCloudKey();
        const endpoint = `https://api.counterapi.dev/v1/learning_os_${key}/sync`;

        try {
          const cloudRes = await fetch(`https://kv.val.run/get?key=los_${key}`);
          const cloudData = cloudRes.ok ? await cloudRes.json() : null;

          if (forceDownload && cloudData) {
            await db.paths.clear();
            await db.tasks.clear();
            if (cloudData.paths) await db.paths.bulkAdd(cloudData.paths);
            if (cloudData.tasks) await db.tasks.bulkAdd(cloudData.tasks);
            await loadLocalData();
            setSyncStatus('همگام شد ✓');
            return;
          }

          const currentPaths = await db.paths.toArray();
          const currentTasks = await db.tasks.toArray();

          const payload = {
            paths: currentPaths,
            tasks: currentTasks,
            updatedAt: Date.now()
          };

          await fetch(`https://kv.val.run/set`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: `los_${key}`, value: payload })
          });

          setSyncStatus('اطلاعات روی سرور ذخیره شد ✓');
        } catch (err) {
          setSyncStatus('خطا در ارتباط اینترنتی (کارکرد آفلاین)');
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!email || !secret) return;
        await db.auth.put({ id: 'current_user', email, secret });
        setIsLoggedIn(true);
        await syncWithCloud(true);
      };

      const handleLogout = async () => {
        await db.auth.delete('current_user');
        setIsLoggedIn(false);
        setEmail('');
        setSecret('');
      };

      const addTask = async (e) => {
        e.preventDefault();
        if (!taskTitle) return;
        const newTask = {
          id: 't-' + Date.now(),
          pathId: paths[0]?.id || 'general',
          title: taskTitle,
          status: 'pending'
        };
        await db.tasks.add(newTask);
        setTaskTitle('');
        await loadLocalData();
        syncWithCloud();
      };

      const addPath = async (e) => {
        e.preventDefault();
        if (!pathTitle) return;
        await db.paths.add({ id: 'p-' + Date.now(), title: pathTitle });
        setPathTitle('');
        await loadLocalData();
        syncWithCloud();
      };

      const deleteTask = async (id) => {
        await db.tasks.delete(id);
        await loadLocalData();
        syncWithCloud();
      };

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-xl mx-auto space-y-5">
          <div className="bg-white p-5 rounded-3xl border shadow-sm flex items-center justify-between">
            <div>
              <h1 className="text-base font-black text-slate-800">Learning OS</h1>
              <p className="text-xs text-slate-500 mt-0.5">{syncStatus}</p>
            </div>
            {isLoggedIn ? (
              <div className="flex items-center gap-2">
                <button onClick={() => syncWithCloud(true)} className="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl font-bold">
                  بروزرسانی داده‌ها
                </button>
                <button onClick={handleLogout} className="text-xs text-rose-500 font-bold px-2 py-1">
                  خروج
                </button>
              </div>
            ) : null}
          </div>

          {!isLoggedIn ? (
            <div className="bg-white p-6 rounded-3xl border shadow-sm space-y-4">
              <h2 className="text-sm font-black text-slate-800">اتصال حساب جهت همگام‌سازی گوشی و لپ‌تاپ</h2>
              <p className="text-xs text-slate-500 leading-relaxed">
                همان ایمیل و رمز دلخواهی که اینجا می‌زنید را روی آیفون هم وارد کنید تا هر دو دستگاه دقیقاً به یکدیگر وصل شوند.
              </p>
              <form onSubmit={handleLogin} className="space-y-3">
                <input
                  type="text"
                  placeholder="ایمیل یا نام کاربری..."
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  className="w-full bg-slate-50 border p-3 rounded-xl text-xs outline-none"
                  required
                />
                <input
                  type="password"
                  placeholder="رمز عبور دلخواه..."
                  value={secret}
                  onChange={e => setSecret(e.target.value)}
                  className="w-full bg-slate-50 border p-3 rounded-xl text-xs outline-none"
                  required
                />
                <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs">
                  ورود و اتصال ابری
                </button>
              </form>
            </div>
          ) : (
            <div className="space-y-5">
              <div className="bg-white p-5 rounded-3xl border shadow-sm space-y-3">
                <h2 className="text-xs font-bold text-slate-700">افزودن مسیر یادگیری</h2>
                <form onSubmit={addPath} className="flex gap-2 text-xs">
                  <input
                    type="text"
                    placeholder="مثال: روانشناسی، زبان انگلیسی..."
                    value={pathTitle}
                    onChange={e => setPathTitle(e.target.value)}
                    className="flex-1 bg-slate-50 border p-2.5 rounded-xl outline-none"
                    required
                  />
                  <button type="submit" className="bg-indigo-600 text-white font-bold px-4 rounded-xl">ثبت مسیر</button>
                </form>
              </div>

              <div className="bg-white p-5 rounded-3xl border shadow-sm space-y-3">
                <h2 className="text-xs font-bold text-slate-700">افزودن کار و برنامه روزانه</h2>
                <form onSubmit={addTask} className="flex gap-2 text-xs">
                  <input
                    type="text"
                    placeholder="عنوان کار (مثال: مطالعه فصل ۱، مرور تست‌ها)..."
                    value={taskTitle}
                    onChange={e => setTaskTitle(e.target.value)}
                    className="flex-1 bg-slate-50 border p-2.5 rounded-xl outline-none"
                    required
                  />
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-4 rounded-xl">افزودن</button>
                </form>

                <div className="space-y-2 pt-2">
                  {tasks.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-400">هنوز تسکی ثبت نشده است.</div>
                  ) : (
                    tasks.map(t => (
                      <div key={t.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl text-xs">
                        <span className="font-bold text-slate-700">{t.title}</span>
                        <button onClick={() => deleteTask(t.id)} className="text-rose-500 font-bold px-2 py-1">حذف</button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
